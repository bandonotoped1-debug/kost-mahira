<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"></noscript>
<style id="appcss">
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,h1,h2,h3,h4,p,figure,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

:root{
  color-scheme:light;
  --ground:#EDF2F0;
  --surface:#FFFFFF;
  --surface-2:#F5F8F7;
  --line:#D5E0DC;
  --line-soft:#E4EBE8;
  --ink:#132C28;
  --ink-2:#3D544F;
  --muted:#6B807B;
  --brand:#0F7A6E;
  --brand-deep:#0A4F47;
  --brand-soft:#DCEDE9;
  --gold:#D99413;
  --gold-soft:#FBEECF;
  --ok:#1F7A55;
  --ok-soft:#DDF0E5;
  --warn:#B5760A;
  --warn-soft:#FAEBD1;
  --bad:#B23A31;
  --bad-soft:#F8E1DE;
  --shadow:0 1px 2px rgba(19,44,40,.05),0 8px 24px -12px rgba(19,44,40,.18);
  --shadow-lg:0 2px 4px rgba(19,44,40,.06),0 24px 60px -24px rgba(19,44,40,.30);
  --r:14px;
  --r-sm:9px;
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0C1615;
    --surface:#14201E;
    --surface-2:#1A2827;
    --line:#283936;
    --line-soft:#1F2E2C;
    --ink:#E7EEEB;
    --ink-2:#BCCBC7;
    --muted:#8AA09B;
    --brand:#3EBBA6;
    --brand-deep:#8FE0D0;
    --brand-soft:#173733;
    --gold:#F0B93F;
    --gold-soft:#33270E;
    --ok:#4FC28D;
    --ok-soft:#12301F;
    --warn:#E3A63A;
    --warn-soft:#312513;
    --bad:#E3796D;
    --bad-soft:#341C19;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 60px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0C1615;--surface:#14201E;--surface-2:#1A2827;--line:#283936;--line-soft:#1F2E2C;
  --ink:#E7EEEB;--ink-2:#BCCBC7;--muted:#8AA09B;--brand:#3EBBA6;--brand-deep:#8FE0D0;--brand-soft:#173733;
  --gold:#F0B93F;--gold-soft:#33270E;--ok:#4FC28D;--ok-soft:#12301F;--warn:#E3A63A;--warn-soft:#312513;
  --bad:#E3796D;--bad-soft:#341C19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 24px 60px -24px rgba(0,0,0,.8);
}

body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.12;text-wrap:balance;letter-spacing:-.02em}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shared atoms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;
  background:var(--brand);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;
  cursor:pointer;transition:filter .15s ease,transform .15s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.gold{background:var(--gold);color:#1c1405}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;
  font-weight:600;letter-spacing:.01em;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-soft)}
.chip.kosong{background:var(--surface-2);color:var(--muted)}
.chip.booking{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.terisi{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.perbaikan{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.lunas{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.dp{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.belum{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow)}
label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:14px;font-weight:500;font-family:var(--body)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{resize:vertical;min-height:74px}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
.empty{padding:38px 20px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- brand mark ---------- */
img.mark{width:36px;height:36px;border-radius:11px;flex:none;object-fit:cover;background:#41BCAF;
  box-shadow:0 1px 3px rgba(19,44,40,.18)}
.logo-full{width:100%;max-width:190px;height:auto;border-radius:16px;box-shadow:var(--shadow)}
.hero-logo{width:104px;margin-bottom:20px}
.btn.icon{padding:7px 11px;font-size:15px;line-height:1}

/* ---------- interaksi tambahan ---------- */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
.reveal.on{opacity:1;transform:none}
.fab{position:fixed;right:18px;bottom:18px;z-index:50;display:inline-flex;align-items:center;gap:9px;
  background:#128C4A;color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;
  box-shadow:0 10px 26px -10px rgba(0,0,0,.5);transition:transform .16s ease}
.fab:hover{transform:translateY(-2px)}
.fab{opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease,visibility .25s}
.fab.show{opacity:1;visibility:visible;transform:none}
@media(max-width:820px){
  .fab span{display:none}
  .fab{padding:15px;right:14px;bottom:76px}
  .wrap{padding:0 16px}
  section.blk{padding:44px 0;scroll-margin-top:62px}
  .sec-head{margin-bottom:20px}
  .calc{padding:16px;gap:16px}
  .contact-card{padding:20px}
  .hero-in{gap:24px}
  .hero-stats{gap:18px 22px}
  .rule-card,.f-card,.review{padding:17px}
  .modal-box{border-radius:16px}
  .modal-body{padding:16px;gap:13px}
  .modal-head,.modal-foot{padding:13px 16px}
  .modal-foot .btn{flex:1;min-width:120px}
}
.room{cursor:pointer}
.room-cta{font-size:13px;font-weight:700;color:var(--brand)}
.masa{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--warn);
  background:var(--warn-soft);border-radius:8px;padding:6px 9px;line-height:1.3}
.masa.siap{color:var(--ok);background:var(--ok-soft)}
.masa svg{flex:none}
button.avail-row{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
button.avail-row:hover{border-color:var(--brand)}
.denah{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line-soft);box-shadow:var(--shadow);overflow-x:auto}
.denah-row{display:grid;grid-template-columns:repeat(5,minmax(126px,1fr));gap:8px}
.denah-cell{border-radius:11px;padding:11px 12px;min-height:74px;display:flex;flex-direction:column;gap:2px;
  justify-content:center;font-family:var(--body);text-align:left}
.denah-cell.fasum{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 7px,var(--line-soft) 7px,var(--line-soft) 8px);
  color:var(--muted);font-size:12px;font-weight:600;border:1px dashed var(--line);align-items:flex-start;justify-content:center}
.room-cell{border:1px solid var(--line);background:var(--surface-2);cursor:pointer;
  transition:transform .15s ease,border-color .15s ease,background .15s ease}
.room-cell:hover{transform:translateY(-2px);border-color:var(--brand)}
.room-cell b{font-family:var(--display);font-size:14px}
.room-cell small{font-size:11px;color:var(--muted)}
.room-cell[data-st="kosong"]{background:var(--brand-soft);border-color:transparent}
.room-cell[data-st="kosong"] b{color:var(--brand-deep)}
.room-cell[data-st="booking"]{background:var(--gold-soft);border-color:transparent}
.room-cell[data-st="perbaikan"]{background:var(--bad-soft);border-color:transparent}
.faq{display:flex;flex-direction:column;gap:9px;max-width:800px}
.faq-item{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:0 18px}
.faq-item summary{cursor:pointer;padding:15px 0;font-weight:700;font-family:var(--display);font-size:15.5px;
  list-style:none;display:flex;align-items:center;gap:10px}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::before{content:"+";color:var(--brand);font-size:19px;font-weight:700;width:16px;flex:none}
.faq-item[open] summary::before{content:"\2212"}
.faq-item p{padding:0 0 16px 26px;font-size:14px;color:var(--ink-2)}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.spec-grid div{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:9px 11px}
.spec-grid i{font-style:normal;font-size:11px;color:var(--muted);display:block;letter-spacing:.05em;text-transform:uppercase}
.spec-grid b{font-size:13.5px}
.tier{border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
.tier-row{display:grid;grid-template-columns:1.3fr .7fr 1fr;gap:10px;padding:10px 14px;font-size:13.5px;align-items:center}
.tier-row+.tier-row{border-top:1px solid var(--line-soft)}
.tier-row.head{background:var(--surface-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tier-row b{text-align:right;font-family:var(--display);font-size:15px}
.tier-row.head span:last-child{text-align:right}
/* ---------- foto & galeri ---------- */
.room-photo{position:relative;margin:-18px -18px 2px;border-radius:var(--r) var(--r) 0 0;overflow:hidden;
  background:var(--surface-2);aspect-ratio:4/3}
.room-photo img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.room:hover .room-photo img{transform:scale(1.04)}
.foto-count{position:absolute;left:10px;bottom:10px;background:rgba(10,25,23,.72);color:#fff;
  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;backdrop-filter:blur(4px)}
/* Foto yang gagal dimuat disembunyikan agar tata letak tetap rapi. */
.room-photo.foto-gagal,.gal-cell.foto-gagal,.gal-thumb.foto-gagal,.gal-main.foto-gagal,.kmr-photo.foto-gagal{display:none}
.foto-adm-item.foto-gagal{position:relative;
  background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 9px,var(--line-soft) 9px,var(--line-soft) 10px)}
.foto-adm-item.foto-gagal img{display:none}
.foto-adm-item.foto-gagal::after{content:"Tidak dapat dimuat";position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;color:var(--muted);text-align:center;padding:8px;pointer-events:none}
.gal{display:flex;flex-direction:column;gap:9px}
.gal-main{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/2;background:var(--surface-2);cursor:zoom-in}
.gal-main img{width:100%;height:100%;object-fit:cover}
.gal-hint{position:absolute;right:10px;bottom:10px;background:rgba(10,25,23,.72);color:#fff;font-size:11.5px;
  font-weight:600;padding:4px 10px;border-radius:999px}
.gal-thumbs{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
.gal-thumb{flex:none;width:74px;height:56px;border-radius:9px;overflow:hidden;border:2px solid transparent;
  padding:0;background:var(--surface-2);cursor:pointer}
.gal-thumb img{width:100%;height:100%;object-fit:cover}
.gal-thumb.on{border-color:var(--brand)}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.gal-cell{position:relative;border:none;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:4/3;
  background:#1b2c29;cursor:zoom-in}
.gal-cell img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease,opacity .3s ease;opacity:.92}
.gal-cell:hover img{transform:scale(1.05);opacity:1}
.gal-cap{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;font-size:11.5px;font-weight:600;
  color:#fff;text-align:left;background:linear-gradient(transparent,rgba(8,20,18,.85))}
.tab-pill.dark{background:transparent;color:#C6D3D0;border-color:rgba(255,255,255,.22)}
.tab-pill.dark[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
.gal-pilih{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#C6D3D0;margin-left:auto}
.gal-pilih select{width:auto;min-width:190px;max-width:100%;background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.22);color:#fff;padding:7px 11px;border-radius:999px;font-size:13px}
.gal-pilih select option{color:#132C28;background:#fff}
@media(max-width:640px){.gal-pilih{margin-left:0;width:100%}.gal-pilih select{flex:1;min-width:0}}
#galeri .note{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);color:#C6D3D0}
#galeri .empty{color:#A9BEB9}
.lightbox{position:fixed;inset:0;z-index:120;background:rgba(6,16,15,.94);display:grid;
  grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:22px}
.lb-figure{margin:0;display:flex;flex-direction:column;gap:12px;align-items:center;max-height:92vh;min-width:0}
.lb-img{max-height:82vh;display:flex}
.lb-img img{max-height:82vh;max-width:100%;width:auto;object-fit:contain;border-radius:12px}
.lb-figure figcaption{color:#C6D3D0;font-size:13px;text-align:center}
.lb-nav{background:rgba(255,255,255,.1);color:#fff;border:none;width:46px;height:46px;border-radius:50%;
  font-size:26px;line-height:1;cursor:pointer;flex:none}
.lb-nav:hover{background:rgba(255,255,255,.2)}
.lb-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.1);color:#fff;border:none;
  width:40px;height:40px;border-radius:50%;font-size:24px;line-height:1;cursor:pointer}
@media(max-width:600px){.lightbox{padding:12px;gap:4px}.lb-nav{width:38px;height:38px;font-size:22px}}
.foto-adm{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.foto-adm-item{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:var(--surface-2)}
.foto-adm-item img{width:100%;height:100%;object-fit:cover}
.foto-adm-act{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:space-between;
  padding:5px;background:linear-gradient(transparent,rgba(8,20,18,.8))}
.foto-adm-act .btn{background:rgba(255,255,255,.9);color:#12211f;border-color:transparent;padding:2px 8px;font-size:12px}
.kmr-photo{width:100%;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--surface-2);margin-bottom:2px}
.kmr-photo img{width:100%;height:100%;object-fit:cover}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable.on{color:var(--brand)}

/* ---------- PUBLIC ---------- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.topbar-in{position:relative;max-width:1120px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none;color:inherit}
.brand-text{display:block;min-width:0}
.brand b{font-family:var(--display);font-size:15.5px;letter-spacing:-.02em;display:block;line-height:1.15;
  white-space:nowrap;color:var(--ink)}
.brand-text span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.nav{margin-left:auto;display:flex;gap:2px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nav a{padding:7px 10px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.nav{flex-wrap:nowrap}
@media(max-width:1120px){.nav a{padding:7px 8px;font-size:13px}.nav .btn{padding:6px 11px}}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav .nav-cta{color:#fff}
.nav-cta,.nav-admin{gap:0}
.bar-act{display:flex;align-items:center;gap:8px;margin-left:8px}
.nav-toggle{display:none;flex-direction:column;justify-content:center;gap:4.5px;width:40px;height:38px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;padding:0 10px}
.nav-toggle span{display:block;height:2px;border-radius:2px;background:var(--ink);transition:transform .2s ease,opacity .2s ease}
.nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
.nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
@media(max-width:1160px){
  .topbar-in{padding:9px 16px;gap:8px}
  .nav-toggle{display:flex}
  .bar-act{margin-left:auto}
  .nav{position:absolute;left:0;right:0;top:100%;display:none;flex-direction:column;align-items:stretch;
    gap:2px;padding:10px 14px 14px;background:var(--surface);border-bottom:1px solid var(--line);
    box-shadow:var(--shadow-lg);margin:0}

function esc(s) {

  n = Number(n) || 0;
  if (n >= 1000000) return "Rp " + (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1).replace(".", ",") + " jt";
  if (n >= 1000) return "Rp " + Math.round(n / 1000) + "rb";
  return rp(n);
}
function uid(p) { return (p || "X") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function todayISO() { var d = new Date(); return d.toISOString().slice(0, 10); }
function periodNow() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function periodLabel(p) {
  if (!p) return "-";

function shiftPeriod(p, n) {
  var a = p.split("-"), d = new Date(Number(a[0]), Number(a[1]) - 1 + n, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");

function fdate(iso) {
  if (!iso) return "-";

}
function addMonths(iso, n) {
  var d = new Date(iso);
  if (isNaN(d)) return "";
  var day = d.getDate();
  d.setMonth(d.getMonth() + Number(n || 0));
  if (d.getDate() < day) d.setDate(0);
  return d.toISOString().slice(0, 10);
}
function daysTo(iso) {
  if (!iso) return null;

/* Skema diskon mengikuti pengaturan, bisa diubah admin. */
var DISKON_BAWAAN = [{ mulai: 1, persen: 15 }, { mulai: 3, persen: 20 }, { mulai: 5, persen: 25 }];
function tierDiskon() {
  var t = (S && S.settings && S.settings.diskon || []).filter(function (x) {
    return Number(x.mulai) > 0 && Number(x.persen) >= 0;
  }).slice().sort(function (a, b) { return Number(a.mulai) - Number(b.mulai); });
  return t.length ? t : DISKON_BAWAAN;
}
function diskonTier(bulan) {
  bulan = Number(bulan) || 0;
  var persen = 0;
  tierDiskon().forEach(function (t) { if (bulan >= Number(t.mulai)) persen = Number(t.persen) || 0; });
  return persen;
}
/* "15% untuk 1–2 bulan, 20% untuk 3–4 bulan, 25% untuk 5 bulan atau lebih" */
function labelDiskon() {
  var t = tierDiskon();
  return t.map(function (x, i) {
    var next = t[i + 1];
    var rentang = next
      ? (Number(x.mulai) === Number(next.mulai) - 1 ? x.mulai + " bulan" : x.mulai + "&ndash;" + (Number(next.mulai) - 1) + " bulan")
      : x.mulai + " bulan atau lebih";
    return x.persen + "% untuk " + rentang;
  }).join(", ");
}
function diskonMaks() {
  return tierDiskon().reduce(function (a, t) { return Math.max(a, Number(t.persen) || 0); }, 0);
}
function bulanTierTertinggi() {
  var t = tierDiskon();
  return Number(t[t.length - 1].mulai) || 1;
}
/* Bulan contoh untuk setiap tingkat diskon, dipakai di tabel harga kamar. */
function contohBulanDiskon() {
  var t = tierDiskon();
  return t.map(function (x, i) {
    var next = t[i + 1];
    return {
      bulan: Number(x.mulai),
      label: next
        ? (Number(x.mulai) === Number(next.mulai) - 1 ? x.mulai + " bulan" : x.mulai + "&ndash;" + (Number(next.mulai) - 1) + " bulan")
        : x.mulai + " bulan atau lebih"
    };
  });
}
function tarifDiskon(tarif, bulan) {
  return Math.round(tarif * (100 - diskonTier(bulan)) / 100);
}
/* Harga tetap per KAMAR. Penghuni kedua menambah biaya sesuai ketentuan,
   lalu totalnya dibagi rata sesuai jumlah penghuni kamar tersebut.
   Tambah kasur dihitung sekali di awal, bukan tiap bulan. */
function hitungTarif(r, bulan, orang, kasur) {
  bulan = Number(bulan) || 1;
  orang = Math.max(1, Number(orang) || 1);
  var dasar = tarifDiskon(r.tarif, bulan);
  var extra = (orang - 1) * S.settings.tambahPenghuni;
  var perKamar = dasar + extra;
  var biayaKasur = kasur ? S.settings.tambahKasur : 0;
  return {
    bulan: bulan, orang: orang, dasar: dasar, extra: extra, perKamar: perKamar,
    perOrang: Math.round(perKamar / orang),
    kasur: biayaKasur,
    kasurPerOrang: Math.round(biayaKasur / orang),
    totalSewa: perKamar * bulan,
    totalAwal: perKamar * bulan + biayaKasur,
    totalPerOrang: Math.round((perKamar * bulan + biayaKasur) / orang)
  };
}

function daftarPenghuniKamar(roomId, draft) {
  var ts = activeTenants(roomId).filter(function (t) { return !draft || t.id !== draft.id; });
  if (draft && draft.status === "aktif" && draft.roomId === roomId) ts = ts.concat([draft]);
  return ts;
}
function hitungKamarTagihan(roomId, draft) {
  var r = room(roomId);
  var ts = daftarPenghuniKamar(roomId, draft);
  var n = Math.max(1, ts.length);
  var bulan = Number((ts[0] || {}).bulanKontrak) || 3;
  var kasur = ts.some(function (t) { return !!t.kasur; });
  var dp = ts.reduce(function (a, t) { return a + (Number(t.dp) || 0); }, 0);
  if (!r) return { n: n, bulan: bulan, dp: dp, total: 0, sisa: 0, perBulanKamar: 0, perBulanOrang: 0, kasur: 0, perKamarNormal: 0 };
  var h = hitungTarif(r, bulan, n, kasur);
  var total = h.perKamar * bulan + h.kasur;
  var sisa = Math.max(0, total - dp);
  var perBulanKamar = Math.round(sisa / Math.max(1, bulan));
  return {
    kamar: r, n: n, bulan: bulan, kasur: h.kasur, dp: dp, total: total, sisa: sisa,
    perKamarNormal: h.perKamar, perBulanKamar: perBulanKamar,
    perBulanOrang: Math.round(perBulanKamar / n)
  };
}
/* Menyamakan tarif seluruh penghuni satu kamar setelah ada perubahan. */
function recalcKamar(roomId) {
  if (!roomId) return null;
  var h = hitungKamarTagihan(roomId);
  activeTenants(roomId).forEach(function (t) {
    t.tarif = h.perBulanOrang;
    t.tarifKamar = h.perBulanKamar;
    t.jumlahPenghuni = h.n;
  });
  return h;
}

function normNama(n) { return String(n || "").toLowerCase().replace(/\s+/g, " ").trim(); }
function cariDuplikat(nama, hp, kecualiId) {
  var kn = normNama(nama);
  var kh = hp ? normHp(hp) : "";
  if (!kn && !kh) return null;
  var t = S.tenants.filter(function (x) {
    if (x.id === kecualiId || x.status !== "aktif") return false;
    return (kn && normNama(x.nama) === kn) || (kh && x.hp && normHp(x.hp) === kh);
  })[0];
  if (t) return { tipe: "penghuni", nama: t.nama, kamar: (room(t.roomId) || {}).nama || "-", data: t };
  var b = S.bookings.filter(function (x) {
    if (x.id === kecualiId || x.status !== "aktif") return false;
    return (kn && normNama(x.nama) === kn) || (kh && x.hp && normHp(x.hp) === kh);
  })[0];
  if (b) return { tipe: "booking", nama: b.nama, kamar: (room(b.roomId) || {}).nama || "belum dipilih", data: b };
  return null;
}
/* Satu kamar hanya boleh punya satu booking aktif dan tidak boleh dibooking bila sudah terisi. */
function kamarBisaDibooking(id) {
  var r = room(id);
  if (!r) return { ok: true };
  if (r.status === "perbaikan") return { ok: false, alasan: "Kamar " + r.nama + " sedang dalam perbaikan." };
  if (activeTenants(id).length) return { ok: false, alasan: "Kamar " + r.nama + " sudah terisi penghuni." };
  var bk = S.bookings.filter(function (b) { return b.roomId === id && b.status === "aktif"; })[0];
  if (bk) return { ok: false, alasan: "Kamar " + r.nama + " sudah dibooking atas nama " + bk.nama + "." };
  return { ok: true };
}
function room(id) { return S.rooms.filter(function (r) { return r.id === id; })[0] || null; }
function tenant(id) { return S.tenants.filter(function (t) { return t.id === id; })[0] || null; }
/* ---------- masa sewa kamar ----------
   Tanggal kamar kembali kosong = tanggal keluar penghuni aktif yang paling akhir.
   Untuk kamar yang sedang dibooking dipakai perkiraan dari tanggal masuk + lama sewa. */
function sewaSampai(r) {
  if (!r) return "";
  var akhir = "";
  activeTenants(r.id).forEach(function (t) {
    if (t.keluar && t.keluar > akhir) akhir = t.keluar;
  });
  if (akhir) return akhir;
  (S.bookings || []).forEach(function (b) {
    if (b.status !== "aktif" || b.roomId !== r.id) return;
    var sampai = addMonths(b.masuk || todayISO(), Number(b.bulan) || 1);
    if (sampai && sampai > akhir) akhir = sampai;
  });
  return akhir;
}
/* Keterangan singkat masa sewa untuk ditampilkan ke calon penyewa. */
function labelSewa(r) {
  if (!r) return "";
  if (r.status === "kosong") return "Siap dihuni sekarang";
  if (r.status === "perbaikan") return "Sedang perbaikan";
  var sampai = sewaSampai(r);
  var awalan = r.status === "booking" ? "Dibooking sampai " : "Terisi sampai ";
  if (!sampai) return r.status === "booking" ? "Sedang dibooking" : "Sedang terisi";
  var sisa = daysTo(sampai);
  var ekor = "";
  if (sisa !== null && sisa >= 0) ekor = sisa === 0 ? " &middot; hari ini" : " &middot; " + sisa + " hari lagi";
  return awalan + fdate(sampai) + ekor;
}
function activeTenants(roomId) {
  return S.tenants.filter(function (t) { return t.status === "aktif" && (!roomId || t.roomId === roomId); });
}

/* Hitung status kamar otomatis dari data penghuni & booking */
function syncRoomStatus() {
  /* Di perangkat pengunjung tidak ada data penghuni, jadi status kamar
     dipakai apa adanya dari server — jangan dihitung ulang. */
  if (statusDariServer && !unlocked) return;
  S.rooms.forEach(function (r) {
    if (r.status === "perbaikan") return;
    var ada = activeTenants(r.id).length > 0;
    var bk = S.bookings.some(function (b) { return b.roomId === r.id && b.status === "aktif"; });
    r.status = ada ? "terisi" : (bk ? "booking" : "kosong");
  });
}

   Pembagian tabelnya mengikuti siapa yang boleh melihat:

                       Boleh dibaca umum, dipakai halaman depan.

     kost_booking    - booking dari pengunjung. Boleh dikirim siapa

var SB = { url: "", anon: "", token: "", email: "", galat: "" };

function sbAktif() { return SB.url.indexOf("http") === 0 && !!SB.anon; }
function sbPasang(url, anon) {
  SB.url = String(url || "").trim().replace(/\/+$/, "");
  SB.anon = String(anon || "").trim();
}
function sbKepala(pakaiToken) {
  var h = { apikey: SB.anon, "Content-Type": "application/json" };
  h.Authorization = "Bearer " + ((pakaiToken && SB.token) || SB.anon);
  return h;
}
function sbMinta(jalur, opsi) {

    method: opsi.method || "GET",
    headers: Object.assign(sbKepala(true), opsi.headers || {}),

  }).then(function (r) {
    /* Permintaan dengan Prefer: return=minimal dijawab tanpa isi, jadi
       badannya dibaca sebagai teks dulu sebelum dicoba diurai. */
    return r.text().then(function (teks) {
      var j = null;
      if (teks) { try { j = JSON.parse(teks); } catch (e) { j = null; } }
      if (!r.ok) {
        throw new Error((j && (j.message || j.error_description || j.hint)) ||
          ("Supabase menolak permintaan (" + r.status + ")"));
      }
      return j;
    });
  });
}

/* ---- masuk sebagai admin memakai email dan kata sandi Supabase ---- */
function sbMasuk(email, sandi) {
  return fetch(SB.url + "/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { apikey: SB.anon, "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: sandi })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.access_token) {
      return { ok: false, error: (j && (j.error_description || j.msg)) || "Email atau kata sandi salah" };
    }
    SB.token = j.access_token;
    SB.email = (j.user && j.user.email) || email;
    return { ok: true, email: SB.email };
  });
}
function sbKeluar() { SB.token = ""; SB.email = ""; }

/* ---- membaca bagian yang boleh dilihat umum ---- */
function sbMuatPublik() {
  return sbMinta("kost_pengaturan?id=eq.1&select=data,updated_at").then(function (rows) {
    var baris = (rows || [])[0];
    /* "kosong" dipakai saat Supabase belum pernah diisi sama sekali.
       Pemanggilnya lalu jatuh kembali ke Apps Script, supaya halaman
       depan tidak mendadak kosong di tengah masa pindahan. */
    if (!baris || !baris.data || !baris.data.rooms) return "kosong";

function sbMuatAdmin() {
  return Promise.all([
    sbMinta("kost_pengaturan?id=eq.1&select=data"),
    sbMinta("kost_penghuni?select=data&order=masuk.desc"),
    sbMinta("kost_booking?select=data&order=dibuat.desc")
  ]).then(function (hasil) {
    var set = ((hasil[0] || [])[0] || {}).data || {};
    if (!set.rooms) return { ok: true, kosong: true };
    var baru = defaultState();
    ["settings", "rooms", "fasilitas", "ulasan", "partners", "ketentuan", "peraturan"].forEach(function (k) {
      if (set[k]) baru[k] = set[k];
    });
    baru.tenants = (hasil[1] || []).map(function (x) { return x.data; }).filter(Boolean);
    baru.bookings = (hasil[2] || []).map(function (x) { return x.data; }).filter(Boolean);
    baru.payments = [];
    var urlLokal = (S.settings && S.settings.server && S.settings.server.url) || "";
    S = baru;
    S.settings.server = Object.assign({ url: urlLokal, terakhir: Date.now() }, S.settings.server || {});
    S.settings.admins = normalkanAdmins(S.settings);
    syncRoomStatus();
    saveLocal();
    return { ok: true, kosong: false };
  });

/* ---- menyimpan seluruh data ---- */
function sbSimpan() {
  if (!SB.token) return Promise.reject(new Error("Masuk dulu sebagai admin Supabase"));
  var set = {};
  ["settings", "rooms", "fasilitas", "ulasan", "partners", "ketentuan", "peraturan"].forEach(function (k) {
    set[k] = S[k];
  });
  var pros = [
    sbMinta("kost_pengaturan?on_conflict=id", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: [{ id: 1, data: set, updated_at: new Date().toISOString(), updated_by: SB.email }]
    })
  ];
  if (S.tenants.length) {
    pros.push(sbMinta("kost_penghuni?on_conflict=id", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: S.tenants.map(sbBarisPenghuni)
    }));
  }
  if (S.bookings.length) {
    pros.push(sbMinta("kost_booking?on_conflict=id", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: S.bookings.map(sbBarisBooking)
    }));
  }
  return Promise.all(pros)
    .then(function () { return sbBuangYangHilang("kost_penghuni", S.tenants); })
    .then(function () { return sbBuangYangHilang("kost_booking", S.bookings); })
    .then(function () {
      S.settings.server.terakhir = Date.now();
      saveLocal();
      return true;
    });
}

/* Baris yang sudah tidak ada di aplikasi ikut dihapus di Supabase,
   supaya "Reset data penghuni" benar-benar bersih sampai ke server. */
function sbBuangYangHilang(tabel, daftar) {
  var id = daftar.map(function (x) { return x.id; }).filter(Boolean);
  var jalur = tabel + "?select=id";
  return sbMinta(jalur).then(function (rows) {
    var buang = (rows || []).map(function (r) { return r.id; })
      .filter(function (x) { return id.indexOf(x) < 0; });
    if (!buang.length) return true;
    var daftarId = buang.map(function (x) { return '"' + String(x).replace(/"/g, "") + '"'; }).join(",");
    return sbMinta(tabel + "?id=in.(" + daftarId + ")", {
      method: "DELETE", headers: { Prefer: "return=minimal" }
    }).then(function () { return true; });
  });
}

/* ---- transport ---- */
function srvFetch(qs) {
  var u = srvUrl();
  /* Panggilan "mode=cek" pertama sudah dikirim skrip pemanasan, pakai jawabannya. */
  if (qs === "mode=cek" && window.__warmCek && u === window.__warmUrl) {
    var hangat = window.__warmCek;
    window.__warmCek = null;
    return hangat.then(function (j) {
      if (j && j.ok) return j;
      return srvFetch(qs);
    });
  }
  return fetch(u + (u.indexOf("?") < 0 ? "?" : "&") + qs + "&t=" + Date.now(), { method: "GET" })
    .then(function (r) { return r.json(); });
}
function srvPost(obj) {
  /* Apps Script tidak mendukung preflight CORS, jadi dikirim sebagai text/plain. */
  return fetch(srvUrl(), {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(obj)
  }).then(function (r) { return r.json(); });
}

function punyaDataAdmin() {
  return !!((S.tenants && S.tenants.length) || (S.payments && S.payments.length) || (S.settings.admins || []).length > 1);
}

function terapkanPublik(pd, dariCache) {
  if (!pd || !pd.rooms || !pd.rooms.length) return false;
  if (punyaDataAdmin() && Number(pd.updatedAt || 0) < Number(S.updatedAt || 0)) return false;
  if (pd.settings) PUBLIK_SETTINGS.forEach(function (k) {
    if (pd.settings[k] !== undefined && pd.settings[k] !== null) S.settings[k] = pd.settings[k];
  });
  S.rooms = pd.rooms.map(function (r) {
    var lama = room(r.id) || {};
    var gab = Object.assign({}, lama, r);
    gab.foto = r.foto && r.foto.length ? r.foto : (lama.foto || []);
    gab.catatan = lama.catatan || "";
    return gab;
  });
  ["fasilitas", "ulasan", "partners", "ketentuan", "peraturan"].forEach(function (k) {
    if (pd[k] && pd[k].length) S[k] = pd[k];
  });
  S.publikAt = Number(pd.updatedAt || 0);
  if (!unlocked && !punyaDataAdmin()) statusDariServer = true;
  if (!dariCache) {
    try { localStorage.setItem(LS_PUBLIK, JSON.stringify(pd)); } catch (e) { }
  }
  return true;
}

function cachePublik() {
  try {
    var r = localStorage.getItem(LS_PUBLIK);
    return r ? JSON.parse(r) : null;
  } catch (e) { return null; }
}

/* Halaman sedang dipakai mengisi form / membuka modal: tunda gambar ulang
   supaya isian pengunjung tidak hilang. */
function bolehGambarUlang() {
  if (document.getElementById("modal")) return false;
  var f = document.getElementById("bookForm");
  if (f) {
    var isi = false;
    Array.prototype.forEach.call(f.querySelectorAll("input,textarea,select"), function (el) {
      if (el.type === "checkbox" || el.type === "radio") { if (el.checked) isi = true; }
      else if (el.type === "date") { /* terisi otomatis, abaikan */ }
      else if (String(el.value || "").trim() && el.name !== "bulan" && el.name !== "orang") isi = true;
    });
    if (isi) return false;
  }
  return true;
}

function gambarUlangAman() {
  if (!bolehGambarUlang()) { adaPembaruanTertunda = true; return; }
  adaPembaruanTertunda = false;

}

/* ---- ambil data publik (dipakai SEMUA pengunjung, tanpa pengaturan) ---- */
function srvMuatPublik(paksa, diam) {
  if (!srvAktif()) { if (!diam) toast("Alamat server belum dipasang di aplikasi"); return Promise.resolve(false); }
  if (srv.memuat) return Promise.resolve(false);
  if (sbAktif()) {
    srv.memuat = true;
    return sbMuatPublik().then(function (berubah) {
      /* Supabase masih kosong dan alamat Apps Script lama masih ada:
         pakai yang lama dulu. Begitu admin menekan "Kirim ke server",
         Supabase terisi dan cabang ini tidak terpakai lagi. */
      if (berubah === "kosong" && KONFIG.url) {
        srv.memuat = false;
        return srvMuatPublikLama(true, diam);
      }
      srv.memuat = false; srv.galat = ""; srv.terakhirCek = Date.now(); tandaiSegar();
      if (!diam) toast(berubah ? "Data terbaru dimuat dari Supabase" : "Data di layar sudah yang terbaru");
      return berubah === "kosong" ? false : berubah;
    }).catch(function (e) {
      srv.memuat = false; srv.galat = String((e && e.message) || e); tandaiSegar();
      if (!diam) toast("Tidak dapat menghubungi Supabase: " + srv.galat);
      return false;
    });
  }
  return srvMuatPublikLama(paksa, diam);
}

/* Pembacaan lewat Google Apps Script — penyimpanan lama. */
function srvMuatPublikLama(paksa, diam) {
  if (srv.memuat) return Promise.resolve(false);
  srv.memuat = true;
  var punya = Number(S.publikAt || 0);
  var mode = (paksa || !punya) ? "publik" : "cek";
  return srvFetch("mode=" + mode)
    .then(function (j) {
      srv.memuat = false;
      if (!j || j.ok !== true) throw new Error((j && j.error) || "server menolak permintaan");
      srv.galat = ""; srv.terakhirCek = Date.now();
      if (j.mode === "cek") {
        if (Number(j.updatedAt || 0) <= punya) { tandaiSegar(); return false; }
        return srvMuatPublikLama(true, diam);
      }
      var berubah = terapkanPublik(j.publik);
      if (berubah) {
        S.settings.server.terakhir = Date.now();
        saveLocal();
        gambarUlangAman();
      }
      tandaiSegar();
      if (!diam) toast(berubah ? "Data terbaru dimuat dari server" : "Data di layar sudah yang terbaru");
      return berubah;
    })
    .catch(function (e) {
      srv.memuat = false;
      srv.galat = String((e && e.message) || e);
      tandaiSegar();
      if (!diam) toast("Tidak dapat menghubungi server: " + srv.galat);
      return false;
    });
}

/* ---- masuk sebagai admin: kode diperiksa server, data lengkap diunduh ---- */
function srvMasuk(kode) {
  return srvFetch("mode=admin&kode=" + encodeURIComponent(kode))
    .then(function (j) {
      if (!j || j.ok !== true) return { ok: false, error: (j && j.error) || "kode admin tidak dikenal" };
      srv.galat = "";
      if (j.sheetUrl) srv.sheetUrl = j.sheetUrl;
      var kosong = !(j.data && j.data.rooms);
      if (!kosong) pakaiDataServer(j.data);
      return { ok: true, admin: j.admin || null, kosong: kosong };
    });
}

function pakaiDataServer(d) {
  var urlLokal = (S.settings && S.settings.server && S.settings.server.url) || "";
  var base = defaultState();
  S = d || S;
  S.settings = Object.assign(base.settings, S.settings || {});
  S.settings.server = Object.assign({ url: urlLokal, terakhir: Date.now(), sheetUrl: srv.sheetUrl || "" }, S.settings.server || {});
  S.settings.server.url = urlLokal || S.settings.server.url || "";
  S.settings.server.terakhir = Date.now();
  if (srv.sheetUrl) S.settings.server.sheetUrl = srv.sheetUrl;
  S.settings.admins = normalkanAdmins(S.settings);
  S.tenants = S.tenants || []; S.payments = S.payments || []; S.bookings = S.bookings || [];
  if (!S.rooms || !S.rooms.length) S.rooms = base.rooms;
  S.rooms.forEach(function (r) { if (!r.foto) r.foto = []; });
  ["fasilitas", "ulasan", "partners", "ketentuan", "peraturan"].forEach(function (k) {
    if (!S[k] || !S[k].length) S[k] = base[k];
  });
  S.serverAt = Number(S.updatedAt || 0);
  S.publikAt = Number(S.updatedAt || 0);
  statusDariServer = false;
  syncRoomStatus();
  saveLocal();
}

/* ---- simpan ke server (hanya admin yang sudah masuk) ---- */
function srvSimpan(diam) {
  if (!srvAktif()) { if (!diam) toast("Alamat server belum dipasang di aplikasi"); return Promise.resolve(false); }
  if (sbAktif()) {
    if (!SB.token) {
      if (!diam) toast("Masuk dulu sebagai admin Supabase untuk menyimpan");
      return Promise.resolve(false);
    }
    if (srv.sibuk) { srv.antre = true; return Promise.resolve(false); }
    srv.sibuk = true;
    return sbSimpan().then(function () {
      srv.sibuk = false; srv.galat = ""; tandaiSegar();
      if (!diam) toast("Tersimpan di Supabase. Semua perangkat ikut terbarui.");
      if (srv.antre) { srv.antre = false; srvJadwalkanSimpan(); }
      return true;
    }).catch(function (e) {
      srv.sibuk = false; srv.galat = String((e && e.message) || e); tandaiSegar();
      toast("Gagal menyimpan ke Supabase: " + srv.galat);
      return false;
    });
  }
  if (!adminAktif || !adminAktif.kode) {
    if (!diam) toast("Masuk sebagai admin dulu untuk menyimpan ke server");
    return Promise.resolve(false);
  }
  if (srv.sibuk) { srv.antre = true; return Promise.resolve(false); }
  srv.sibuk = true;
  S.updatedBy = adminAktif.nama || "";
  return srvPost({ aksi: "simpan", kode: adminAktif.kode, base: Number(S.serverAt || 0), data: S })
    .then(function (j) {
      srv.sibuk = false;
      if (!j || j.ok !== true) throw new Error((j && j.error) || "server menolak menyimpan");
      srv.galat = "";
      S.serverAt = Number(j.updatedAt || S.updatedAt || 0);
      S.publikAt = S.serverAt;
      S.updatedAt = S.serverAt;
      S.settings.server.terakhir = Date.now();
      if (j.sheetUrl && String(j.sheetUrl).indexOf("http") === 0) S.settings.server.sheetUrl = j.sheetUrl;
      /* booking dari pengunjung yang masuk saat kita sedang menyunting: jangan sampai hilang */
      var tambahan = j.bookingTambahan || [];
      if (tambahan.length) {
        var ada = {};
        S.bookings.forEach(function (b) { ada[b.id] = 1; });
        tambahan.forEach(function (b) { if (!ada[b.id]) S.bookings.unshift(b); });
        syncRoomStatus();
        if (unlocked) renderAdmin();
        toast(tambahan.length + " booking baru dari halaman publik ikut tersimpan");
      }
      saveLocal();
      tandaiSegar();
      if (!diam) toast("Tersimpan di server. Semua perangkat dan halaman publik ikut terbarui.");
      if (srv.antre) { srv.antre = false; srvJadwalkanSimpan(); }
      return true;
    })
    .catch(function (e) {
      srv.sibuk = false;
      srv.galat = String((e && e.message) || e);
      tandaiSegar();
      if (!diam) toast("Gagal menyimpan ke server: " + srv.galat);
      else toast("Perubahan tersimpan di perangkat ini, server belum menerima. Coba tombol Kirim ke server.");
      return false;
    });
}

function srvJadwalkanSimpan() {
  if (!srvAktif() || !adminAktif) return;
  if (S.settings.server && S.settings.server.auto === false) return;
  clearTimeout(srvTimerSimpan);
  srvTimerSimpan = setTimeout(function () { srvSimpan(true); }, 1400);
}

/* ---- booking dari pengunjung langsung masuk ke server ---- */

/* ---- pemantauan berkala supaya layar selalu menampilkan data terbaru ---- */
function srvPantau() {
  clearInterval(srvTimerPantau);
  if (!srvAktif()) return;
  srvTimerPantau = setInterval(function () {
    if (document.hidden || srv.sibuk || srv.memuat) return;
    if (adaPembaruanTertunda && bolehGambarUlang()) gambarUlangAman();
    if (unlocked && adminAktif) srvSegarkanAdmin(true);
    else srvMuatPublik(false, true);
  }, 45000);
  if (!window.__srvVisBound) {
    window.__srvVisBound = true;
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return;
      if (unlocked && adminAktif) srvSegarkanAdmin(true);
      else srvMuatPublik(false, true);
    });
  }
}

/* Admin: ambil ulang data lengkap bila ada admin lain yang menyimpan */
function srvSegarkanAdmin(diam) {
  if (sbAktif()) {
    if (!SB.token) return Promise.resolve(false);
    if (document.getElementById("modal")) { adaPembaruanTertunda = true; return Promise.resolve(false); }
    return sbMuatAdmin().then(function () {
      srv.galat = ""; renderAdmin(); tandaiSegar();
      if (!diam) toast("Data disegarkan dari Supabase");
      return true;
    }).catch(function (e) {
      srv.galat = String((e && e.message) || e); tandaiSegar();
      if (!diam) toast("Gagal menyegarkan: " + srv.galat);
      return false;
    });
  }
  if (!srvAktif() || !adminAktif) return Promise.resolve(false);
  if (srv.sibuk || srv.memuat) return Promise.resolve(false);
  srv.memuat = true;
  return srvFetch("mode=cek")
    .then(function (j) {
      srv.memuat = false;
      if (!j || j.ok !== true) throw new Error((j && j.error) || "server menolak");
      srv.galat = ""; tandaiSegar();
      if (Number(j.updatedAt || 0) <= Number(S.serverAt || 0)) {
        if (!diam) toast("Data di layar sudah yang terbaru");
        return false;
      }
      if (document.getElementById("modal")) { adaPembaruanTertunda = true; return false; }
      return srvMasuk(adminAktif.kode).then(function (h) {

        renderAdmin();
        toast("Data diperbarui" + (S.updatedBy ? " oleh " + S.updatedBy : "") );
        return true;
      });

    .catch(function (e) {
      srv.memuat = false;
      srv.galat = String((e && e.message) || e);
      tandaiSegar();
      if (!diam) toast("Tidak dapat menghubungi server: " + srv.galat);
      return false;
    });

/* ---- daftar admin ---- */
function normalkanAdmins(st) {
  var list = (st && st.admins) || [];
  list = list.filter(function (a) { return a && a.kode; }).map(function (a) {
    return {
      id: a.id || uid("A"), nama: a.nama || "Admin", hp: a.hp || "",
      kode: String(a.kode).trim(), peran: a.peran === "pengelola" ? "pengelola" : "pemilik",
      aktif: a.aktif !== false, dibuat: a.dibuat || todayISO(), terakhirMasuk: a.terakhirMasuk || ""
    };
  });
  if (!list.length) {
    list = [{
      id: "A1", nama: "Pemilik kost", hp: (st && st.wa) || "", kode: String((st && st.pin) || "1234"),
      peran: "pemilik", aktif: true, dibuat: todayISO(), terakhirMasuk: ""
    }];
  }
  return list;
}
/* Menautkan kode yang dipakai masuk ke satu baris admin. Kode bawaan "1234"
   yang belum pernah dipakai langsung digantikan, supaya tidak ada dua
   pemilik dan kode bawaan tidak ikut tersimpan di server. */
function pastikanAdminMasuk(kode, info) {
  var ada = cariAdminKode(kode);
  if (ada) return ada;
  S.settings.admins = S.settings.admins || [];
  var list = S.settings.admins;
  var bawaan = list.filter(function (a) {
    return String(a.kode).trim() === "1234" && !a.terakhirMasuk;
  })[0];
  if (bawaan && list.length === 1) {
    bawaan.kode = kode;
    if (info && info.nama) bawaan.nama = info.nama;
    bawaan.peran = (info && info.peran) || "pemilik";
    bawaan.aktif = true;
    return bawaan;
  }
  var baru = {
    id: uid("A"), nama: (info && info.nama) || "Pemilik kost", hp: "", kode: kode,
    peran: (info && info.peran) || "pemilik", aktif: true, dibuat: todayISO(), terakhirMasuk: ""
  };
  list.push(baru);
  return baru;
}

function cariAdminKode(kode) {
  kode = String(kode || "").trim();
  if (!kode) return null;
  var l = (S.settings.admins || []).filter(function (a) { return a.aktif !== false && String(a.kode).trim() === kode; });
  return l[0] || null;
}
function bolehKelolaAdmin() { return !!(adminAktif && adminAktif.peran === "pemilik"); }

    "",
    "function doGet(e) {",
    "  try {",
    "    const mode = (e && e.parameter && e.parameter.mode) || 'publik';",
    "    const d = baca();",
    "    if (mode === 'cek') return balas({ ok: true, mode: 'cek', updatedAt: d ? (d.updatedAt || 0) : 0 });",
    "    if (mode === 'admin') {",
    "      const adm = cekKode(d, e.parameter.kode || '');",
    "      if (!adm) return balas({ ok: false, error: 'kode admin tidak dikenal' });",
    "      return balas({ ok: true, mode: 'admin', admin: { nama: adm.nama, peran: adm.peran }, data: d, sheetUrl: urlSheet() });",
    "    }",
    "    return balas({ ok: true, mode: 'publik', updatedAt: d ? (d.updatedAt || 0) : 0, publik: ringkasPublik(d) });",
    "  } catch (err) { return balas({ ok: false, error: String(err) }); }",
    "}",
    "",
    "function doPost(e) {",
    "  const kunciProses = LockService.getScriptLock();",
    "  try { kunciProses.waitLock(25000); } catch (err) { return balas({ ok: false, error: 'server sedang sibuk' }); }",
    "  try {",
    "    const k = JSON.parse((e && e.postData && e.postData.contents) || '{}');",
    "    const aksi = k.aksi || 'simpan';",
    "    const lama = baca();",
    "",
    "    if (aksi === 'booking') {",
    "      const b = k.booking || {};",
    "      if (!b.nama) return balas({ ok: false, error: 'nama kosong' });",
    "      if (!lama) return balas({ ok: false, error: 'data kost belum ada di server' });",
    "      b.id = b.id || ('B' + Date.now());",
    "      b.dibuatAt = Date.now();",
    "      b.status = 'aktif';",
    "      lama.bookings = lama.bookings || [];",
    "      if (!lama.bookings.some(function (x) { return x.id === b.id; })) lama.bookings.unshift(b);",
    "      hitungStatusKamar(lama);",
    "      lama.updatedAt = Date.now();",
    "      lama.updatedBy = 'pengunjung';",
    "      simpan(lama); tulisSheetAman(lama);",
    "      return balas({ ok: true, updatedAt: lama.updatedAt });",
    "    }",
    "",
    "    if (aksi === 'simpan') {",
    "      const baru = k.data;",
    "      if (!baru || !baru.rooms) return balas({ ok: false, error: 'data tidak lengkap' });",
    "      const adm = cekKode(lama || baru, k.kode || '');",
    "      if (!adm) return balas({ ok: false, error: 'kode admin tidak dikenal' });",
    "      const tambahan = [];",
    "      if (lama) {",
    "        const ada = {};",
    "        (baru.bookings || []).forEach(function (b) { ada[b.id] = 1; });",
    "        (lama.bookings || []).forEach(function (b) {",
    "          if (!ada[b.id] && Number(b.dibuatAt || 0) > Number(k.base || 0)) tambahan.push(b);",
    "        });",
    "      }",
    "      baru.bookings = tambahan.concat(baru.bookings || []);",
    "      hitungStatusKamar(baru);",
    "      baru.updatedAt = Date.now();",
    "      baru.updatedBy = adm.nama || '';",
    "      simpan(baru);",
    "      const url = tulisSheetAman(baru);",
    "      return balas({ ok: true, updatedAt: baru.updatedAt, bookingTambahan: tambahan, sheetUrl: url });",
    "    }",
    "",
    "    return balas({ ok: false, error: 'aksi tidak dikenal' });",
    "  } catch (err) { return balas({ ok: false, error: String(err) }); }",
    "  finally { kunciProses.releaseLock(); }",
    "}",
    "",
    "/* ---------- keamanan ---------- */",
    "function cekKode(d, kode) {",
    "  kode = String(kode || '').trim();",
    "  if (!kode) return null;",
    "  if (kode === KODE_PEMILIK) return { nama: 'Pemilik kost', peran: 'pemilik' };",
    "  const daftar = (d && d.settings && d.settings.admins) || [];",
    "  for (let i = 0; i < daftar.length; i++) {",
    "    const a = daftar[i];",
    "    if (a && a.aktif !== false && String(a.kode || '').trim() === kode) return a;",
    "  }",
    "  return null;",
    "}",
    "",
    "/* ---------- data yang boleh dibaca umum ---------- */",
    "function ringkasPublik(d) {",
    "  if (!d) return null;",
    "  const st = d.settings || {};",
    "  const bolehSetting = ['nama', 'alamat', 'wa', 'dp', 'harian', 'mingguan', 'tambahPenghuni',",
    "    'tambahKasur', 'tarifTanggal', 'diskon', 'katalog', 'ulasan', 'ulasanJumlah', 'ulasanRating', 'ulasanEmbed'];",
    "  const s = {};",
    "  bolehSetting.forEach(function (k) { s[k] = st[k]; });",
    "  return {",
    "    updatedAt: d.updatedAt || 0,",
    "    settings: s,",
    "    rooms: (d.rooms || []).map(function (r) {",
    "      return { id: r.id, nama: r.nama, blok: r.blok, lantai: r.lantai, ukuran: r.ukuran, luas: r.luas,",
    "        km: r.km, bed: r.bed, dingin: r.dingin, max: r.max, tarif: r.tarif, status: r.status, foto: r.foto || [] };",
    "    }),",
    "    fasilitas: d.fasilitas || [], ulasan: d.ulasan || [], partners: d.partners || [],",
    "    ketentuan: d.ketentuan || [], peraturan: d.peraturan || []",
    "  };",
    "}",
    "",
    "function hitungStatusKamar(d) {",
    "  const aktif = {}, dibooking = {};",
    "  (d.tenants || []).forEach(function (t) { if (t.status === 'aktif' && t.roomId) aktif[t.roomId] = 1; });",
    "  (d.bookings || []).forEach(function (b) { if (b.status === 'aktif' && b.roomId) dibooking[b.roomId] = 1; });",
    "  (d.rooms || []).forEach(function (r) {",
    "    if (r.status === 'perbaikan') return;",
    "    r.status = aktif[r.id] ? 'terisi' : (dibooking[r.id] ? 'booking' : 'kosong');",
    "  });",
    "}",
    "",
    "/* ---------- penyimpanan di Google Drive ---------- */",
    "function berkasData() {",
    "  const id = P.getProperty('fileId');",
    "  if (id) { try { return DriveApp.getFileById(id); } catch (err) { } }",
    "  const cari = DriveApp.getFilesByName(NAMA_BERKAS);",
    "  if (cari.hasNext()) { const f = cari.next(); P.setProperty('fileId', f.getId()); return f; }",
    "  const baru = DriveApp.createFile(NAMA_BERKAS, '', MimeType.PLAIN_TEXT);",
    "  P.setProperty('fileId', baru.getId());",
    "  return baru;",
    "}",
    "function baca() {",
    "  try {",
    "    const teks = berkasData().getBlob().getDataAsString();",
    "    return teks ? JSON.parse(teks) : null;",
    "  } catch (err) { return null; }",
    "}",
    "function simpan(d) { berkasData().setContent(JSON.stringify(d)); }",
    "",
    "/* ---------- salinan ke Google Spreadsheet ---------- */",
    "function tulisSheetAman(d) { try { return tulisSpreadsheet(d); } catch (err) { return 'gagal: ' + err; } }",
    "function bukaSheet() {",
    "  let id = SPREADSHEET_ID || P.getProperty('sheetId');",
    "  if (id) { try { return SpreadsheetApp.openById(id); } catch (err) { id = ''; } }",
    "  const ss = SpreadsheetApp.create('Data Kost Muslimah Mahira');",
    "  P.setProperty('sheetId', ss.getId());",
    "  return ss;",
    "}",
    "function urlSheet() {",
    "  const id = SPREADSHEET_ID || P.getProperty('sheetId');",
    "  return id ? 'https://docs.google.com/spreadsheets/d/' + id : '';",
    "}",
    "function tulisSpreadsheet(d) {",
    "  if (!d) return urlSheet();",
    "  const ss = bukaSheet();",
    "  const kamar = {}; (d.rooms || []).forEach(function (r) { kamar[r.id] = r.nama; });",
    "  const nama = {}; (d.tenants || []).forEach(function (t) { nama[t.id] = t.nama; });",
    "",
    "  isiSheet(ss, 'Kamar',",
    "    ['Kamar', 'Blok', 'Lantai', 'Ukuran', 'Luas m2', 'Kamar mandi', 'Pendingin', 'Maks', 'Tarif', 'Status'],",
    "    (d.rooms || []).map(function (r) {",
    "      return [r.nama, r.blok, r.lantai, r.ukuran, r.luas, r.km, r.dingin, r.max, r.tarif, r.status];",
    "    }));",
    "",
    "  isiSheet(ss, 'Penghuni',",
    "    ['Nama', 'No HP', 'Kamar', 'Alamat KTP', 'Pekerjaan', 'Kampus/Instansi', 'Masuk', 'Kontrak (bln)',",
    "     'Berakhir', 'DP', 'Bukti DP', 'Angsuran/bulan', 'Jml penghuni', 'KTP', 'Status', 'Catatan'],",
    "    (d.tenants || []).map(function (t) {",
    "      return [t.nama, t.hp, kamar[t.roomId] || '', t.alamat, t.pekerjaan, t.institusi, t.masuk,",
    "        t.bulanKontrak, t.keluar, t.dp || 0, (t.dpBukti || []).length ? (t.dpBukti || []).length + ' foto' : '',",
    "        t.tarif || 0, t.jumlahPenghuni || 1, t.ktpFoto ? 'ada foto' : (t.ktp || ''), t.status, t.catatan];",
    "    }));",
    "",
    "  isiSheet(ss, 'Pembayaran',",
    "    ['Periode', 'Kamar', 'Penghuni', 'Tagihan', 'Dibayar', 'Kurang', 'Tanggal', 'Metode', 'Bukti', 'Catatan'],",
    "    (d.payments || []).slice().sort(function (a, b) { return a.periode < b.periode ? -1 : 1; })",
    "      .map(function (p) {",
    "        return [p.periode, kamar[p.roomId] || '', nama[p.tenantId] || '', p.tagihan || 0,",
    "          p.dibayar || 0, (p.tagihan || 0) - (p.dibayar || 0), p.tanggal, p.metode,",
    "          (p.bukti || []).length ? (p.bukti || []).length + ' foto' : 'belum ada', p.catatan];",
    "      }));",
    "",
    "  isiSheet(ss, 'Booking',",
    "    ['Dibuat', 'Nama', 'No HP', 'Penghuni kedua', 'No HP kedua', 'Kamar', 'Rencana masuk',",
    "     'Lama (bln)', 'Jml orang', 'DP', 'Bukti DP', 'Status', 'Catatan'],",
    "    (d.bookings || []).map(function (b) {",
    "      return [b.dibuat, b.nama, b.hp, b.nama2 || '', b.hp2 || '', kamar[b.roomId] || '', b.masuk,",
    "        b.bulan, b.orang || 1, b.dp || 0, (b.bukti || []).length ? (b.bukti || []).length + ' foto' : '',",
    "        b.status, b.catatan || ''];",
    "    }));",
    "",
    "  isiSheet(ss, 'Admin',",
    "    ['Nama', 'No HP', 'Peran', 'Aktif', 'Dibuat', 'Terakhir masuk'],",
    "    ((d.settings && d.settings.admins) || []).map(function (a) {",
    "      return [a.nama, a.hp || '', a.peran, a.aktif === false ? 'nonaktif' : 'aktif', a.dibuat || '', a.terakhirMasuk || ''];",
    "    }));",
    "",
    "  return ss.getUrl();",
    "}",
    "function isiSheet(ss, namaLembar, judul, baris) {",
    "  const sh = ss.getSheetByName(namaLembar) || ss.insertSheet(namaLembar);",
    "  sh.clear();",
    "  sh.getRange(1, 1, 1, judul.length).setValues([judul]).setFontWeight('bold');",
    "  sh.setFrozenRows(1);",
    "  if (baris.length) sh.getRange(2, 1, baris.length, judul.length).setValues(baris);",
    "  sh.autoResizeColumns(1, judul.length);",
    "  const kosong = ss.getSheetByName('Sheet1');",
    "  if (kosong && ss.getSheets().length > 1) ss.deleteSheet(kosong);",
    "}",
    "",
    "function balas(obj) {",
    "  return ContentService.createTextOutput(JSON.stringify(obj))",
    "    .setMimeType(ContentService.MimeType.JSON);",
    "}"
  ];
  return baris.join("\n");
}

/* ============================================================
   IMPOR DAFTAR HARGA KOST
   Menerima salinan tabel daftar harga (dari PDF, Excel, atau CSV)
   dengan kolom: NO, JENIS, SIZE, KM, BED, AC/KIPAS, MAX PENGHUNI, TARIF.
   ============================================================ */

function labelTarif() {
  var t = S.settings.tarifTanggal;
  if (!t) return "";
  return "diperbarui " + fdate(t);
}
function judulTarif() {
  var t = S.settings.tarifTanggal;
  return t ? "Tarif kamar (diperbarui " + fdate(t) + ")" : "Tarif kamar";
}

function angkaRp(s) {
  var n = String(s == null ? "" : s).replace(/[^0-9]/g, "");
  return n ? Number(n) : 0;
}
function samaNama(a, b) {
  function bersih(x) {
    return String(x || "").toLowerCase().replace(/aliva/g, "alifa").replace(/[^a-z0-9]/g, "");
  }
  return bersih(a) === bersih(b);
}

/* Memisah satu baris teks menjadi kolom, mengikuti pemisah yang paling masuk akal. */
function pisahBaris(baris) {
  if (baris.indexOf("\t") >= 0) return baris.split("\t");
  if (baris.indexOf("|") >= 0) return baris.split("|");
  var titikKoma = (baris.match(/;/g) || []).length;
  var koma = (baris.match(/,/g) || []).length;
  if (titikKoma >= koma && titikKoma > 0) return baris.split(";");
  if (koma > 0) return pisahKoma(baris);
  return baris.split(/\s{2,}/);
}
/* Pemisah koma yang menghormati tanda kutip (format CSV biasa). */
function pisahKoma(baris) {
  var out = [], cur = "", kutip = false;
  for (var i = 0; i < baris.length; i++) {
    var c = baris[i];
    if (c === '"') { if (kutip && baris[i + 1] === '"') { cur += '"'; i++; } else kutip = !kutip; }
    else if (c === "," && !kutip) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

var PETA_KOLOM = [
  ["nama", ["jenis", "kamar", "nama"]],
  ["ukuran", ["size", "ukuran"]],
  ["km", ["km", "kamar mandi", "mandi"]],
  ["bed", ["bed", "tempat tidur", "kasur"]],
  ["dingin", ["ac/kipas", "ac / kipas", "pendingin", "ac", "kipas"]],
  ["max", ["max penghuni", "maks penghuni", "max", "maks", "penghuni"]],
  ["tarif", ["tarif normal", "tarif", "harga normal", "harga"]]
];

function bariskanTeks(teks) {
  return String(teks || "").split(/\r?\n/).map(function (b) { return b.trim(); }).filter(function (b) { return b; });
}

/* Membaca teks tabel menjadi daftar {nama, ukuran, km, bed, dingin, max, tarif}. */
function bacaTabelHarga(teks) {
  var baris = bariskanTeks(teks);
  var hasil = [], urutan = null, catatan = [], diskonKol = [], diskonNilai = [];
  baris.forEach(function (b) {
    var sel = pisahBaris(b).map(function (s) { return s.trim().replace(/^"|"$/g, ""); });
    if (sel.length < 3) return;                       /* judul blok atau baris kosong */
    var gabung = sel.join(" ").toLowerCase();

    /* baris judul kolom */
    if (/jenis|kamar/.test(gabung) && /tarif|harga/.test(gabung)) {
      urutan = sel.map(function (h) {
        var hh = h.toLowerCase().trim();
        var ketemu = "";
        PETA_KOLOM.forEach(function (p) {
          if (!ketemu && p[1].some(function (k) { return hh === k || hh.indexOf(k) >= 0; })) ketemu = p[0];
        });
        if (/^no\.?$/.test(hh)) ketemu = "no";
        if (!ketemu && (/%/.test(hh) || /bayar/.test(hh))) ketemu = "diskon";
        return ketemu;
      });
      diskonKol = [];
      urutan.forEach(function (k, i) { if (k === "diskon") diskonKol.push({ i: i, judul: sel[i] }); });
      diskonNilai = diskonKol.map(function () { return []; });
      return;
    }
    var baw = {};
    if (urutan) {
      urutan.forEach(function (k, i) { if (k && k !== "no" && k !== "diskon" && sel[i] != null) baw[k] = sel[i]; });
    } else {
      /* tanpa judul kolom: urutan mengikuti daftar harga resmi */
      var mulai = /^\d+[.)]?$/.test(sel[0]) ? 1 : 0;
      var kunci = ["nama", "ukuran", "km", "bed", "dingin", "max", "tarif"];
      kunci.forEach(function (k, i) { if (sel[mulai + i] != null) baw[k] = sel[mulai + i]; });
    }
    if (!baw.nama) return;
    if (/^(no|jenis|blok)$/i.test(baw.nama.trim())) return;
    var tarif = angkaRp(baw.tarif);
    if (!tarif) { catatan.push(baw.nama + " (tarif tidak terbaca)"); return; }
    diskonKol.forEach(function (k, idx) {
      var nilai = angkaRp(sel[k.i]);
      if (nilai > 0 && nilai <= tarif) diskonNilai[idx].push(Math.round((1 - nilai / tarif) * 100));
    });
    hasil.push({
      nama: baw.nama.trim().replace(/\s+/g, " "),
      ukuran: (baw.ukuran || "").trim().replace(/\s*[xX]\s*/, " x "),
      km: /luar/i.test(baw.km || "") ? "Luar" : (baw.km ? "Dalam" : ""),
      bed: (baw.bed || "").trim(),
      dingin: /ac/i.test(baw.dingin || "") ? "AC" : (/kipas/i.test(baw.dingin || "") ? "Kipas" : ""),
      max: Number(String(baw.max || "").replace(/[^0-9]/g, "")) || 0,
      tarif: tarif
    });
  });
  return { baris: hasil, catatan: catatan, diskon: bacaDiskonKolom(diskonKol, diskonNilai) };
}

/* Menyimpulkan skema diskon dari kolom persentase pada tabel yang ditempel. */
function bacaDiskonKolom(kolom, nilai) {
  if (!kolom.length) return null;
  var out = [];
  kolom.forEach(function (k, idx) {
    var angka = nilai[idx] || [];
    if (!angka.length) return;
    /* persentase yang paling sering muncul di kolom itu */
    var hitung = {}, terbanyak = angka[0];
    angka.forEach(function (a) {
      hitung[a] = (hitung[a] || 0) + 1;
      if (hitung[a] > (hitung[terbanyak] || 0)) terbanyak = a;
    });
    var persen = Number(terbanyak);
    if (!(persen > 0 && persen < 90)) return;
    /* "BAYAR 1-2 BULAN" atau "15% 1-2 bulan" -> mulai bulan 1 */
    var m = String(k.judul || "").match(/(\d+)\s*[-–—]\s*\d+\s*bulan/i) || String(k.judul || "").match(/(\d+)\s*bulan/i);
    var mulai = m ? Number(m[1]) : 0;
    out.push({ mulai: mulai, persen: persen });
  });
  if (!out.length) return null;
  /* bila judul kolom tidak menyebut bulan, pakai tingkat yang berlaku sekarang */
  var acuan = tierDiskon();
  out.forEach(function (o, i) {
    if (!o.mulai) o.mulai = acuan[i] ? Number(acuan[i].mulai) : (i * 2 + 1);
  });
  return out.sort(function (a, b) { return a.mulai - b.mulai; });
}

/* Membandingkan hasil bacaan dengan data kamar sekarang. */
function bandingkanHarga(rows) {
  return rows.map(function (r) {
    var kamar = S.rooms.filter(function (x) { return samaNama(x.nama, r.nama); })[0];
    var ubah = [];
    if (kamar) {
      if (r.tarif && r.tarif !== kamar.tarif) ubah.push("tarif " + rp(kamar.tarif) + " &rarr; <b>" + rp(r.tarif) + "</b>");
      if (r.ukuran && r.ukuran !== kamar.ukuran) ubah.push("ukuran " + esc(kamar.ukuran) + " &rarr; <b>" + esc(r.ukuran) + "</b>");
      if (r.km && r.km !== kamar.km) ubah.push("KM " + kamar.km + " &rarr; <b>" + r.km + "</b>");
      if (r.bed && r.bed !== kamar.bed) ubah.push("bed " + esc(kamar.bed) + " &rarr; <b>" + esc(r.bed) + "</b>");
      if (r.dingin && r.dingin !== kamar.dingin) ubah.push("pendingin " + kamar.dingin + " &rarr; <b>" + r.dingin + "</b>");
      if (r.max && r.max !== kamar.max) ubah.push("maks " + kamar.max + " &rarr; <b>" + r.max + "</b> orang");
    }
    return { data: r, kamar: kamar || null, ubah: ubah };
  });
}

/* Menerapkan hasil impor ke data kamar. */
function terapkanHarga(cek, tambahBaru) {
  var diubah = 0, ditambah = 0;
  cek.forEach(function (c) {
    var r = c.data;
    if (c.kamar) {
      if (!c.ubah.length) return;
      var k = c.kamar;
      if (r.tarif) k.tarif = r.tarif;
      if (r.ukuran) k.ukuran = r.ukuran;
      if (r.km) k.km = r.km;
      if (r.bed) k.bed = r.bed;
      if (r.dingin) k.dingin = r.dingin;
      if (r.max) k.max = r.max;
      if (!k.luas && r.ukuran) k.luas = luasDariUkuran(r.ukuran);
      diubah++;
    } else if (tambahBaru) {
      var rapi = rapikanNama(r.nama);
      var blok = rapi.split(/\s+/)[0];
      S.rooms.push({
        id: uid("R"), nama: rapi, blok: BLOK.indexOf(blok) >= 0 ? blok : (BLOK[0] || blok),
        lantai: LANTAI[blok] || 1, ukuran: r.ukuran || "", luas: luasDariUkuran(r.ukuran),
        km: r.km || "Dalam", bed: r.bed || "Single", dingin: r.dingin || "Kipas",
        max: r.max || 1, tarif: r.tarif, status: "kosong", catatan: "", foto: []
      });
      ditambah++;
    }
  });
  S.settings.tarifTanggal = todayISO();
  S.rooms.forEach(function (k) { recalcKamar(k.id); });
  syncRoomStatus();
  return { diubah: diubah, ditambah: ditambah };
}
/* "ALIFA 8" atau "aliva 8" menjadi "Alifa 8" agar seragam dengan kamar lain. */
function rapikanNama(n) {
  return String(n || "").toLowerCase().replace(/aliva/g, "alifa").replace(/\s+/g, " ").trim()
    .replace(/(^|\s)([a-z])/g, function (m, sp, c) { return sp + c.toUpperCase(); });
}
function luasDariUkuran(u) {
  var m = String(u || "").match(/([\d.,]+)\s*[xX]\s*([\d.,]+)/);
  if (!m) return 0;
  var a = parseFloat(m[1].replace(",", ".")), b = parseFloat(m[2].replace(",", "."));
  return Math.round(a * b * 100) / 100 || 0;
}

function contohTabelHarga() {
  var head = "NO,JENIS,SIZE,KM,BED,AC/KIPAS,MAX PENGHUNI,TARIF NORMAL";
  var baris = S.rooms.map(function (r, i) {
    return [i + 1, r.nama, r.ukuran, r.km, r.bed, r.dingin, r.max, r.tarif].map(function (c) {
      return '"' + String(c).replace(/"/g, '""') + '"';
    }).join(",");
  });
  return [head].concat(baris).join("\n");
}

function bintangHtml(n) {
  n = Math.max(0, Math.min(5, Number(n) || 5));
  var s = "";
  for (var i = 0; i < 5; i++) s += i < n ? "&#9733;" : "&#9734;";
  return s;
}
/* Membaca beberapa ulasan sekaligus dari teks tempelan.
   Format per baris: Nama | bintang | waktu | isi ulasan
   Pemisah boleh | atau tab; bintang dan waktu boleh dikosongkan. */
function bacaUlasanTempel(teks) {
  var hasil = [];
  bariskanTeks(teks).forEach(function (b) {
    var sel = (b.indexOf("|") >= 0 ? b.split("|") : b.split("\t")).map(function (x) { return x.trim(); });
    if (sel.length < 2) return;
    var nama = sel[0];
    var bintang = 5, waktu = "", isi = "";
    if (sel.length >= 4) {
      bintang = Number(String(sel[1]).replace(/[^0-9]/g, "")) || 5;
      waktu = sel[2];
      isi = sel.slice(3).join(" | ");
    } else if (sel.length === 3) {
      var mungkinBintang = Number(String(sel[1]).replace(/[^0-9]/g, ""));
      if (mungkinBintang >= 1 && mungkinBintang <= 5 && sel[1].length <= 2) { bintang = mungkinBintang; isi = sel[2]; }
      else { waktu = sel[1]; isi = sel[2]; }
    } else {
      isi = sel[1];
    }
    if (!nama || !isi) return;
    hasil.push({ nama: nama, bintang: bintang, waktu: waktu, teks: isi, aktif: true });
  });
  return hasil;
}
function contohUlasanTempel() {

    "Nama Lain | 4 | setahun lalu | Kost bersih, admin ramah, harga terjangkau."].join("\n");
}

/* Berkas foto yang disimpan bersama situs ini, mis. "foto/parkir-motor.jpg". */
function fotoLokal(src) {
  return !!src && (src.indexOf("/") >= 0 || /\.(jpe?g|png|webp|gif|avif)$/i.test(src));
}
function fotoUrl(src, w) {
  if (!src) return "";
  if (src.indexOf("data:") === 0 || src.indexOf("http") === 0 || fotoLokal(src)) return src;
  return "https://lh3.googleusercontent.com/d/" + src + "=w" + (w || 1200);
}
function fotoAlt(src) {
  if (!src || src.indexOf("data:") === 0 || src.indexOf("http") === 0 || fotoLokal(src)) return "";
  return "https://drive.google.com/thumbnail?id=" + src + "&sz=w1200";
}
/* Galeri sebuah kamar: foto unggahan admin bila ada, selain itu 3 foto
   dari subfolder kamar tersebut di Google Drive. */
function galeriKamar(r) {
  if (!r) return [];
  if (r.foto && r.foto.length) {
    return r.foto.map(function (f) { return { s: f.s || f, l: f.l || r.nama }; });
  }
  return (FOTO_KAMAR[r.nama] || []).map(function (id) { return { s: id, l: r.nama }; });
}

function galeriBlok(blok) {
  var out = [];
  (S && S.rooms ? S.rooms : []).forEach(function (r) {
    if (r.blok === blok) out = out.concat(galeriKamar(r));
  });
  return out;
}
function galeriFasum() {
  return FOTO_FASUM.map(function (f) { return { s: f[0], l: f[1] }; });
}
function semuaFotoKamar() {
  var out = [];
  (S && S.rooms ? S.rooms : []).forEach(function (r) { out = out.concat(galeriKamar(r)); });

}

  return galeriFasum().concat(semuaFotoKamar());
}
/* Gambar dengan cadangan alamat kedua bila alamat pertama gagal dimuat. */
function imgTag(src, alt, cls, w) {
  var alt2 = fotoAlt(src);
  return '<img class="' + (cls || "") + '" loading="lazy" decoding="async" alt="' + esc(alt) + '"' +
    ' src="' + fotoUrl(src, w || 800) + '"' +
    (alt2 ? ' data-fallback="' + alt2 + '"' : "") + ' onerror="fotoGagal(this)">';
}
var fotoGagalCount = 0;
function fotoGagal(el) {
  var fb = el.getAttribute("data-fallback");
  if (fb && el.src !== fb) { el.removeAttribute("data-fallback"); el.src = fb; return; }
  el.removeAttribute("onerror");
  var box = el.parentNode;
  if (box) box.classList.add("foto-gagal");
  fotoGagalCount++;
  var note = document.getElementById("fotoNote");
  if (note && fotoGagalCount > 2) note.hidden = false;
}

/* Menggabungkan daftar menjadi kalimat: "A dan B", atau "A, B, dan C". */
function rangkai(arr) {
  arr = arr.filter(Boolean);
  if (!arr.length) return "";
  if (arr.length === 1) return arr[0];
  if (arr.length === 2) return arr[0] + " dan " + arr[1];
  return arr.slice(0, -1).join(", ") + ", dan " + arr[arr.length - 1];
}
/* Kalimat pengantar di halaman depan. Semuanya dihitung dari data yang ada
   di panel admin, jadi begitu kamar atau fasilitas diubah, kalimat ini ikut
   berubah sendiri tanpa perlu disunting. */
function kalimatRingkas() {
  var kamar = S.rooms || [];
  var blok = daftarBlok().filter(function (b) {
    return kamar.some(function (r) { return r.blok === b; });
  });
  var bagian = [];

  if (kamar.length) {
    bagian.push(kamar.length + " kamar" +
      (blok.length ? " dalam " + blok.length + " blok &mdash; " + rangkai(blok.map(esc)) : "") + ".");
  }

  var sifat = [];
  var dalam = kamar.filter(function (r) { return r.km === "Dalam"; }).length;
  if (kamar.length && dalam === kamar.length) sifat.push("Semua kamar mandi dalam");
  else if (dalam) sifat.push(dalam + " dari " + kamar.length + " kamar ber-kamar mandi dalam");
  var ac = kamar.filter(function (r) { return r.dingin === "AC"; }).length;
  if (ac) sifat.push(ac + " kamar ber-AC");
  if (sifat.length) bagian.push(sifat.join(", ") + ".");

  var fasilitas = (S.fasilitas || []).filter(function (f) { return f.aktif !== false && f.nama; })
    .map(function (f) { return esc(f.nama); });
  if (fasilitas.length) {
    var tampil = fasilitas.slice(0, 6);
    var sisa = fasilitas.length - tampil.length;
    if (sisa > 0) tampil.push(sisa + " fasilitas lainnya");
    bagian.push("Fasilitas bersama: " + rangkai(tampil) + ".");
  }
  return bagian.join(" ") || esc(S.settings.alamat || "");
}

function denahGrid(lantai) {
  return DENAH[lantai].map(function (row) {
    return '<div class="denah-row">' + row.map(function (cell) {
      if (cell.n) return '<div class="denah-cell fasum">' + cell.n + "</div>";
      var r = roomByName(cell.r);
      if (!r) return '<div class="denah-cell fasum">' + cell.r + "</div>";
      return '<button class="denah-cell room-cell" data-st="' + r.status + '" data-detail="' + r.id + '">' +
        "<b>" + esc(r.nama) + "</b><small>" + String(r.luas).replace(".", ",") + " m&sup2; &middot; " + r.dingin + "</small>" +
        '<small class="tnum">' + rpk(r.tarif) + "</small></button>";
    }).join("") + "</div>";
  }).join("");
}

function roomCards() {
  var list = S.rooms.filter(function (r) {
    if (pub.blok !== "Semua" && r.blok !== pub.blok) return false;
    if (pub.kosong && r.status !== "kosong") return false;
    if (pub.ac && r.dingin !== "AC") return false;
    return true;
  });
  if (!list.length) return '<div class="empty" style="grid-column:1/-1">Tidak ada kamar yang cocok dengan filter ini.</div>';
  return list.map(function (r) {
    var tierAkhir = contohBulanDiskon()[contohBulanDiskon().length - 1];
    var d5 = tarifDiskon(r.tarif, tierAkhir.bulan);
    var g = galeriKamar(r);
    return '<article class="room reveal" data-detail="' + r.id + '" tabindex="0" role="button" aria-label="Detail kamar ' + esc(r.nama) + '">' +
      '<div class="room-photo">' + (g.length ? imgTag(g[0].s, "Foto kamar " + r.nama, "", 640) : "") +
      (g.length > 1 ? '<span class="foto-count">' + g.length + " foto</span>" : "") + "</div>" +
      '<div class="room-top"><div><h3>' + esc(r.nama) + "</h3>" +
      "<small>Lantai " + r.lantai + " &middot; " + r.ukuran + " m &middot; " + String(r.luas).replace(".", ",") + " m&sup2;</small></div>" +
      '<span class="chip ' + r.status + '"><i class="dot"></i>' + statusLabel(r.status) + "</span></div>" +
      '<div class="masa ' + (r.status === "kosong" ? "siap" : "") + '">' +
      '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' +
      '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>' +
      labelSewa(r) + "</div>" +
      '<div class="spec">' +
      "<span><i>Kamar mandi</i><br>" + r.km + "</span>" +
      "<span><i>Pendingin</i><br>" + r.dingin + "</span>" +
      "<span><i>Tempat tidur</i><br>" + r.bed + "</span>" +
      "<span><i>Maks penghuni</i><br>" + r.max + " orang</span>" +
      "</div>" +
      '<div class="price"><div class="price-main"><b class="tnum">' + rp(r.tarif) + "</b><span>/bulan</span></div>" +
      '<div class="price-sub">Sewa ' + tierAkhir.label + ' jadi <b class="tnum">' + rp(d5) + "</b>/bulan</div></div>" +
      '<span class="room-cta">' + (r.status === "kosong" ? "Lihat detail &amp; booking &rarr;" : "Lihat detail kamar &rarr;") + "</span>" +
      "</article>";
  }).join("");
}

function calcForm() {
  var r = room(pub.calcRoom) || S.rooms[0];
  var jenisPilih = '<label class="field">Jenis sewa<select data-calc="jenis">' +
    [["bulanan", "Bulanan"], ["mingguan", "Mingguan"], ["harian", "Harian"]].map(function (j) {
      return '<option value="' + j[0] + '"' + (pub.calcJenis === j[0] ? " selected" : "") + ">" + j[1] + "</option>";
    }).join("") + "</select></label>";
  var kamarPilih = '<label class="field">Kamar<select data-calc="room">' +
    S.rooms.map(function (x) {
      return '<option value="' + x.id + '"' + (x.id === r.id ? " selected" : "") + ">" + esc(x.nama) +
        " &mdash; " + rp(x.tarif) + (x.status === "kosong" ? "" : " (" + statusLabel(x.status) + ")") + "</option>";
    }).join("") + "</select></label>";

  /* --- sewa harian atau mingguan --- */
  if (pub.calcJenis === "harian" || pub.calcJenis === "mingguan") {
    var harian = pub.calcJenis === "harian";
    var jml = Math.max(1, Number(pub.calcJumlah) || (harian ? 3 : 1));
    var satuan = harian ? S.settings.harian : S.settings.mingguan;
    var total = satuan * jml;
    var setaraHari = harian ? jml : jml * 7;
    return '<div style="display:flex;flex-direction:column;gap:14px">' + jenisPilih + kamarPilih +
