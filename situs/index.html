function animateCounters() {
  var els = document.querySelectorAll("[data-count]");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  els.forEach(function (el) {
    var target = Number(el.dataset.count) || 0;
    if (reduce) { el.textContent = target; return; }
    var start = performance.now(), dur = 700;
    function step(t) {
      var p = Math.min(1, (t - start) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function observeReveal() {
  var els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window) ||
    (window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches)) {
    els.forEach(function (e) { e.classList.add("on"); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add("on"); io.unobserve(en.target); }
    });
  }, { rootMargin: "0px 0px -40px 0px", threshold: 0.05 });
  els.forEach(function (e) { io.observe(e); });
}

function bindPublic() {
  var root = document.getElementById("root");

  root.querySelectorAll("[data-blok]").forEach(function (b) {
    b.onclick = function () { pub.blok = b.dataset.blok; renderPublic(); jumpTo("kamar"); };
  });
  root.querySelectorAll("[data-blok-jump]").forEach(function (b) {
    b.onclick = function () { pub.blok = b.dataset.blokJump; pub.kosong = true; renderPublic(); jumpTo("kamar"); };
  });
  root.querySelectorAll("[data-lantai]").forEach(function (b) {
    b.onclick = function () { pub.lantai = Number(b.dataset.lantai); renderPublic(); jumpTo("denah"); };
  });
  root.querySelectorAll("[data-f]").forEach(function (c) {
    c.onchange = function () { pub[c.dataset.f] = c.checked; renderPublic(); jumpTo("kamar"); };
  });
  bindGaleriBagian(root);
  var semua = root.querySelector('[data-act="ulasan-semua"]');
  if (semua) semua.onclick = function () {
    pub.ulasanSemua = !pub.ulasanSemua;
    renderPublic();
    jumpTo("ulasan");
  };
  pasangEmbedUlasan(root);
  root.querySelectorAll("[data-detail]").forEach(function (b) {
    b.onclick = function () { modalDetailPublik(b.dataset.detail); };
    b.onkeydown = function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); modalDetailPublik(b.dataset.detail); }
    };
  });
  root.querySelectorAll("[data-book-room]").forEach(function (b) {
    b.onclick = function () { bookingKamar(b.dataset.bookRoom); };
  });
  root.querySelectorAll("[data-calc]").forEach(function (s) {
    s.onchange = function () {
      if (s.dataset.calc === "room") pub.calcRoom = s.value;
      if (s.dataset.calc === "bulan") pub.calcBulan = s.value;
      if (s.dataset.calc === "orang") pub.calcOrang = s.value;
      if (s.dataset.calc === "kasur") pub.calcKasur = s.checked;
      if (s.dataset.calc === "jenis") { pub.calcJenis = s.value; pub.calcJumlah = s.value === "harian" ? 3 : 1; }
      if (s.dataset.calc === "jumlah") pub.calcJumlah = s.value;
      document.querySelector(".calc").innerHTML = calcForm();
      bindPublic();
    };
  });
  bindTheme(root);
  bindMenu(root);
  bindFab();
  var toAdmin = root.querySelector('[data-act="to-admin"]');
  if (toAdmin) toAdmin.onclick = function () { view = "admin"; renderApp(); };
  var segPub = root.querySelector('[data-act="segarkan-publik"]');
  if (segPub) segPub.onclick = function () {
    if (!srvAktif()) return toast("Server belum dipasang di aplikasi ini");
    toast("Mengambil data terbaru...");
    srvMuatPublik(true, false);
  };

  var form = document.getElementById("bookForm");
  if (form) {
    function toggleOrangDua() {
      var dua = Number(form.orang.value) > 1;
      var box = document.getElementById("orangDua");
      if (box) box.hidden = !dua;
      form.nama2.required = dua;
      form.hp2.required = dua;
    }
    ["roomId", "bulan", "orang", "kasur"].forEach(function (n) {
      form[n].onchange = function () { toggleOrangDua(); ringkasBooking(); };
    });
    toggleOrangDua();
    ringkasBooking();
    form.onsubmit = function (e) {
      e.preventDefault();
      var f = new FormData(form);
      var r = room(f.get("roomId"));
      var bulan = Number(f.get("bulan")) || 1;
      var orang = Number(f.get("orang")) || 1;
      var nama = (f.get("nama") || "").trim();
      var hp = (f.get("hp") || "").trim();

      var nama2 = (f.get("nama2") || "").trim();
      var hp2 = (f.get("hp2") || "").trim();
      if (orang > 1 && (!nama2 || !hp2)) { toast("Lengkapi nama dan nomor WhatsApp penghuni kedua."); return; }
      if (orang > 1 && normNama(nama2) === normNama(nama)) { toast("Nama penghuni kedua tidak boleh sama dengan penghuni pertama."); return; }

      /* Cegah nama atau nomor yang sama dibooking dua kali */
      var dup = cariDuplikat(nama, hp) || (orang > 1 ? cariDuplikat(nama2, hp2) : null);
      if (dup) {
        toast(dup.tipe === "penghuni"
          ? "Nama atau nomor ini sudah terdaftar sebagai penghuni kamar " + dup.kamar
          : "Nama atau nomor ini sudah punya booking aktif untuk " + dup.kamar);
        return;
      }
      /* Cegah satu kamar dibooking dua orang */
      if (r) {
        var cek = kamarBisaDibooking(r.id);
        if (!cek.ok) { syncRoomStatus(); renderPublic(); toast(cek.alasan + " Silakan pilih kamar lain."); jumpTo("booking"); return; }
        if (orang > r.max) { toast("Kamar " + r.nama + " maksimal " + r.max + " penghuni."); return; }
      }

      var berkasBukti = Array.prototype.slice.call((form.buktiDp && form.buktiDp.files) || []).slice(0, 3);
      var tombol = form.querySelector('button[type="submit"]');
      if (tombol) { tombol.disabled = true; tombol.textContent = berkasBukti.length ? "Mengirim bukti..." : "Mengirim..."; }

      kumpulkanBukti(berkasBukti, function (bukti) {
        lanjutkanBooking(bukti);
        if (tombol) { tombol.disabled = false; tombol.textContent = "Kirim booking ke WhatsApp admin"; }
      });

      function lanjutkanBooking(bukti) {
      var b = {
        id: uid("B"), nama: nama, hp: hp,
        roomId: f.get("roomId") || "", masuk: f.get("masuk") || todayISO(), bulan: bulan,
        orang: orang, kasur: !!f.get("kasur"),
        nama2: nama2, hp2: hp2, pekerjaan2: (f.get("pekerjaan2") || "").trim(),
        pekerjaan: (f.get("pekerjaan") || "").trim(), catatan: (f.get("catatan") || "").trim(),
        dp: 0, bukti: bukti || [], status: "aktif", dibuat: todayISO(), dibuatAt: Date.now()
      };
      S.bookings.unshift(b);
      pub.bookRoom = "";
      /* Di perangkat pengunjung status kamar berasal dari server; tandai
         seketika supaya kamar itu langsung terlihat sedang dibooking. */
      if (statusDariServer && r && r.status === "kosong") r.status = "booking";
      syncRoomStatus();
      touch("quiet");
      /* Booking dikirim ke server supaya admin melihatnya di perangkat mana pun. */
      srvKirimBooking(b).then(function (ok) {
        if (ok) { S.publikAt = 0; setTimeout(function () { srvMuatPublik(true, true); }, 1500); }
        else if (srvAktif()) toast("Booking terkirim lewat WhatsApp. Data ke server gagal, admin tetap menerima pesan Anda.");
      });
      var hb = r ? hitungTarif(r, bulan, orang, b.kasur) : null;
      var pesan = waTeks("bookingPembuka", { kost: S.settings.nama }) + "\n\n" +
        "Nama: " + b.nama + "\nWhatsApp: " + b.hp +
        "\nKamar: " + (r ? r.nama + " (" + rp(hb.perKamar) + "/bulan per kamar setelah diskon " + diskonTier(bulan) + "%" +
          (orang > 1 ? ", patungan " + orang + " orang = " + rp(hb.perOrang) + "/orang" : "") +
          (b.kasur ? ", tambah kasur " + rp(hb.kasur) : "") + ")" : "belum menentukan, mohon rekomendasi") +
        "\nRencana masuk: " + fdate(b.masuk) + "\nLama sewa: " + bulan + " bulan" +
        "\nJumlah penghuni: " + orang + " orang" +
        (b.pekerjaan ? "\nStatus: " + b.pekerjaan : "") +
        (orang > 1 ? "\n\nPenghuni kedua:\nNama: " + nama2 + "\nWhatsApp: " + hp2 +
          (b.pekerjaan2 ? "\nStatus: " + b.pekerjaan2 : "") : "") +
        (b.catatan ? "\nCatatan: " + b.catatan : "") +
        (bulan > 1 ? "\n\nSaya mengerti sewa lebih dari 1 bulan dibayar cash di awal saat masuk kost." : "") +
        "\n\n" + waTeks("bookingPenutup", { kost: S.settings.nama, dp: rp(S.settings.dp) });
      window.open(waLink(pesan), "_blank", "noopener");
      form.reset();
      renderPublic();
      toast((bukti && bukti.length ? bukti.length + " bukti ikut terkirim. " : "") + "Booking tercatat. Lanjutkan chat di WhatsApp.");
      jumpTo("booking");
      }
    };
  }
}
/* Mengecilkan beberapa berkas bukti sekaligus, lalu memanggil balik sekali. */
function kumpulkanBukti(files, cb) {
  if (!files || !files.length) return cb([]);
  var hasil = [], sisa = files.length;
  files.forEach(function (fl, i) {
    kecilkanBukti(fl, function (url) {
      if (url) hasil.push({ s: url, l: "Bukti transfer DP", t: todayISO() });
      if (--sisa === 0) cb(hasil);
    });
  });
}

/* Menu ringkas untuk layar ponsel */
function bindMenu(root) {
  var nav = root.querySelector("#mainnav");
  var btn = root.querySelector('[data-act="menu"]');
  if (!nav || !btn) return;
  function set(open) {
    nav.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    btn.setAttribute("aria-label", open ? "Tutup menu" : "Buka menu");
  }
  btn.onclick = function (e) { e.stopPropagation(); set(!nav.classList.contains("open")); };
  nav.querySelectorAll("a,button").forEach(function (el) {
    el.addEventListener("click", function () { set(false); });
  });
  document.addEventListener("click", function (e) {
    if (nav.classList.contains("open") && !nav.contains(e.target) && e.target !== btn) set(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && nav.classList.contains("open")) set(false);
  });
}

function sortTenants(list) {
  var k = ui.sortKey, d = ui.sortDir;
  return list.slice().sort(function (a, b) {
    var va, vb;
    if (k === "kamar") { va = (room(a.roomId) || {}).nama || ""; vb = (room(b.roomId) || {}).nama || ""; }
    else if (k === "tarif") { va = Number(a.tarif) || 0; vb = Number(b.tarif) || 0; }
    else { va = a[k] || ""; vb = b[k] || ""; }
    if (typeof va === "string") { va = va.toLowerCase(); vb = String(vb).toLowerCase(); }
    return va < vb ? -d : va > vb ? d : 0;
  });
}
function th(key, label) {
  var on = ui.sortKey === key;
  return '<th class="sortable' + (on ? " on" : "") + '" data-sort="' + key + '" title="Urutkan berdasarkan ' + label + '">' +
    label + (on ? (ui.sortDir > 0 ? " &uarr;" : " &darr;") : "") + "</th>";
}

function renderLogin() {
  var kodeTersimpan = "";
  var emailTersimpan = "";
  try {
    kodeTersimpan = localStorage.getItem(LS_ADMIN) || "";
    emailTersimpan = localStorage.getItem(LS_ADMIN + "-email") || "";
  } catch (e) { }
  document.getElementById("root").innerHTML =

    '<img class="logo-full" src="' + LOGO_FULL + '" alt="Logo Kost Muslimah Mahira" style="width:150px;margin:0 auto">' +
    "<h2>Panel Admin Kost Mahira</h2>" +
    '<p class="muted" style="font-size:13.5px;margin-top:-8px">' +
    (sbAktif()
      ? "Masuk dengan email dan kata sandi admin yang terdaftar di Supabase. Berlaku di HP maupun laptop."
      : "Masukkan kode admin Anda. Kode yang sama berlaku di HP maupun laptop, dan langsung menampilkan data terbaru dari server.") +
    "</p>" +
    (sbAktif()
      ? '<input name="email" type="email" placeholder="Email admin" autocomplete="username" required value="' + esc(emailTersimpan) + '">' +
        '<input class="pinput" type="password" name="kode" placeholder="Kata sandi" autocomplete="current-password" required>'
      : '<input class="pinput" type="password" name="kode" placeholder="Kode admin" autocomplete="current-password" ' +
        'value="' + esc(kodeTersimpan) + '" required>') +
    '<label class="sw" style="justify-content:center"><input type="checkbox" id="ingatKode"' +
    ((sbAktif() ? emailTersimpan : kodeTersimpan) ? " checked" : "") + "> " +
    (sbAktif() ? "Ingat email di perangkat ini" : "Ingat kode di perangkat ini") + "</label>" +
    '<button class="btn block" type="submit" id="masukBtn">Masuk</button>' +
    '<button class="btn ghost block" type="button" data-act="to-publik">Kembali ke halaman publik</button>' +
    '<p class="muted" style="font-size:12px;text-align:center">' +
    (sbAktif() ? "Terhubung ke Supabase. Akun admin dibuat pemilik lewat menu Authentication di Supabase."
      : srvAktif() ? "Terhubung ke server bersama. Kode admin baru dibuat oleh pemilik kost di menu Pengaturan."
      : "Server belum dipasang &mdash; data hanya tersimpan di perangkat ini.") + "</p>" +
    "</form></div>";
  var f = document.getElementById("loginForm");
  f.onsubmit = function (e) {
    e.preventDefault();
    var kode = String(f.kode.value || "").trim();
    if (!kode) return;
    var ingat = document.getElementById("ingatKode").checked;
    var btn = document.getElementById("masukBtn");
    var selesai = function (ok, nama) {
      if (!ok) { f.kode.value = ""; f.kode.focus(); btn.disabled = false; btn.textContent = "Masuk"; return; }
      try {
        if (ingat) localStorage.setItem(LS_ADMIN, kode); else localStorage.removeItem(LS_ADMIN);
      } catch (er) { }
      unlocked = true;
      if (adminAktif) {
        adminAktif.terakhirMasuk = new Date().toISOString().slice(0, 16).replace("T", " ");
        var di = (S.settings.admins || []).filter(function (a) { return a.id === adminAktif.id; })[0];
        if (di) di.terakhirMasuk = adminAktif.terakhirMasuk;
      }
      renderAdmin();
      srvPantau();
      toast("Selamat datang, " + (nama || "Admin"));
      touch("quiet");
    };

    if (sbAktif()) {
      var email = String(f.email.value || "").trim();
      btn.disabled = true; btn.textContent = "Memeriksa...";
      sbMasuk(email, kode).then(function (h) {
        if (!h.ok) {
          btn.disabled = false; btn.textContent = "Masuk";
          f.kode.value = ""; f.kode.focus();
          return toast(h.error);
        }
        try {
          if (ingat) localStorage.setItem(LS_ADMIN + "-email", email);
          else localStorage.removeItem(LS_ADMIN + "-email");
        } catch (er) { }
        adminAktif = { id: "SB", nama: email.split("@")[0], peran: "pemilik", kode: "", aktif: true };
        sbMuatAdmin().then(function (r) {
          unlocked = true;
          renderAdmin();
          srvPantau();
          toast(r.kosong
            ? "Masuk sebagai " + email + ". Supabase masih kosong, tekan Kirim ke server untuk mengisinya."
            : "Selamat datang, " + adminAktif.nama);
          if (r.kosong) setTimeout(function () { srvSimpan(true); }, 600);
        }).catch(function (e) {
          btn.disabled = false; btn.textContent = "Masuk";
          toast("Gagal mengambil data: " + ((e && e.message) || e));
        });
      });
      return;
    }

    if (srvAktif()) {
      /* Masuk cepat: bila kode ini sudah pernah dipakai di perangkat ini dan
         datanya masih tersimpan, panel langsung terbuka memakai data lokal.
         Data terbaru dari server menyusul di latar belakang, jadi admin tidak
         perlu menunggu Google Apps Script menjawab dulu. */
      var lokalCepat = punyaDataAdmin() ? cariAdminKode(kode) : null;
      if (lokalCepat) {
        try {
          if (ingat) localStorage.setItem(LS_ADMIN, kode); else localStorage.removeItem(LS_ADMIN);
        } catch (er) { }
        unlocked = true;
        adminAktif = lokalCepat;
        renderAdmin();
        srvPantau();
        toast("Selamat datang, " + (lokalCepat.nama || "Admin") + ". Menyegarkan data dari server...");
        srvMasuk(kode).then(function (h) {
          if (!h.ok) {
            unlocked = false; adminAktif = null;
            try { localStorage.removeItem(LS_ADMIN); } catch (er) { }
            renderApp();
            toast(h.error || "Kode admin sudah tidak berlaku di server");
            return;
          }
          if (h.kosong) { tandaiSegar(); srvSimpan(false); return; }
          adminAktif = pastikanAdminMasuk(kode, h.admin);
          adminAktif.terakhirMasuk = new Date().toISOString().slice(0, 16).replace("T", " ");
          var di = (S.settings.admins || []).filter(function (a) { return a.id === adminAktif.id; })[0];
          if (di) di.terakhirMasuk = adminAktif.terakhirMasuk;
          renderAdmin();
          tandaiSegar();
          touch("quiet");
        }).catch(function () {
          tandaiSegar();
          toast("Server belum terhubung. Data yang tampil dari perangkat ini.");
        });
        return;
      }

      btn.disabled = true; btn.textContent = "Memeriksa kode...";
      srvMasuk(kode).then(function (h) {
        if (!h.ok) {
          /* server menolak: coba kode yang tersimpan di perangkat ini (mode luring) */
          var lokal = cariAdminKode(kode);
          if (lokal) { adminAktif = lokal; toast("Server menolak kode, memakai data perangkat ini"); return selesai(true, lokal.nama); }
          toast(h.error || "Kode admin tidak dikenal");
          return selesai(false);
        }
        if (h.kosong) {
          /* server masih kosong: pakai data perangkat ini lalu kirim ke server */
          adminAktif = pastikanAdminMasuk(kode, h.admin);
          toast("Server masih kosong. Data perangkat ini akan dikirim ke server.");
          selesai(true, adminAktif.nama);
          setTimeout(function () { srvSimpan(false); }, 400);
          return;
        }
        adminAktif = pastikanAdminMasuk(kode, h.admin);
        selesai(true, adminAktif.nama);
      }).catch(function (er) {
        var lokal = cariAdminKode(kode);
        if (lokal) { adminAktif = lokal; toast("Server tidak terhubung, memakai data perangkat ini"); return selesai(true, lokal.nama); }
        toast("Server tidak dapat dihubungi dan kode tidak dikenal di perangkat ini");
        selesai(false);
      });
      return;
    }

    var lokal = cariAdminKode(kode);
    if (lokal) { adminAktif = lokal; return selesai(true, lokal.nama); }
    toast("Kode admin salah");
    selesai(false);
  };
  f.querySelector('[data-act="to-publik"]').onclick = function () { view = "publik"; renderApp(); };
}

function viewDashboard() {
  var terisi = S.rooms.filter(function (r) { return r.status === "terisi"; }).length;
  var kosong = S.rooms.filter(function (r) { return r.status === "kosong"; }).length;
  var booking = S.rooms.filter(function (r) { return r.status === "booking"; }).length;
  var perbaikan = S.rooms.filter(function (r) { return r.status === "perbaikan"; }).length;
  var okup = S.rooms.length ? Math.round(terisi / S.rooms.length * 100) : 0;

  var jatuhTempo = S.tenants.filter(function (t) {
    if (t.status !== "aktif" || !t.keluar) return false;
    var d = daysTo(t.keluar);
    return d !== null && d <= 30;
  }).sort(function (a, b) { return a.keluar < b.keluar ? -1 : 1; });

  var bookingBaru = (S.bookings || []).filter(function (b) { return b.status === "aktif"; });

  return '<div class="stat-grid">' +

  });

    '<div class="sp">' +

function closeModal() {
  var m = document.getElementById("modal");
  if (m) m.remove();
  /* Pembaruan dari server yang tadi ditunda karena modal terbuka. */
  if (adaPembaruanTertunda) {
    if (unlocked && adminAktif) srvSegarkanAdmin(true);
    else gambarUlangAman();
  }
}
function openModal(title, bodyHTML, footHTML, onMount) {
  closeModal();
  var d = document.createElement("div");
  d.className = "modal";
  d.id = "modal";
  d.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true">' +
    '<div class="modal-head"><h3>' + title + '</h3><button class="x" data-close aria-label="Tutup">&times;</button></div>' +
    '<div class="modal-body">' + bodyHTML + "</div>" +
    (footHTML ? '<div class="modal-foot">' + footHTML + "</div>" : "") + "</div>";
  document.body.appendChild(d);
  d.addEventListener("click", function (e) {
    if (e.target === d || e.target.hasAttribute("data-close")) closeModal();
  });
  document.addEventListener("keydown", function esckey(e) {
    if (e.key !== "Escape") return;
    if (document.getElementById("lightbox")) return; /* biarkan lightbox yang menutup lebih dulu */
    closeModal();
    document.removeEventListener("keydown", esckey);
  });
  if (onMount) onMount(d);
  var first = d.querySelector("input,select,textarea");
  if (first) first.focus();
}

/* ---------- galeri & lightbox ---------- */
function bindGaleri(d, g, nama) {
  if (!g || !g.length) return;
  var main = d.querySelector(".gal-main");
  if (!main) return;
  function tampil(i) {
    main.dataset.i = i;
    main.innerHTML = imgTag(g[i].s, "Foto kamar " + nama, "", 1000) +
      '<span class="gal-hint">Klik untuk memperbesar &middot; ' + (i + 1) + "/" + g.length + "</span>";
    d.querySelectorAll("[data-thumb]").forEach(function (t) {
      t.classList.toggle("on", Number(t.dataset.thumb) === i);
    });
  }
  d.querySelectorAll("[data-thumb]").forEach(function (t) {
    t.onclick = function () { tampil(Number(t.dataset.thumb)); };
  });
  main.onclick = function () { openLightbox(g, Number(main.dataset.i) || 0); };
}

function openLightbox(list, idx) {
  if (!list || !list.length) return;
  var i = idx || 0;
  var box = document.createElement("div");
  box.className = "lightbox";
  box.id = "lightbox";
  box.innerHTML =
    '<button class="lb-close" aria-label="Tutup">&times;</button>' +
    '<button class="lb-nav prev" aria-label="Foto sebelumnya">&#8249;</button>' +
    '<figure class="lb-figure"><div class="lb-img"></div><figcaption></figcaption></figure>' +
    '<button class="lb-nav next" aria-label="Foto berikutnya">&#8250;</button>';
  document.body.appendChild(box);
  document.body.style.overflow = "hidden";

  function tampil() {
    box.querySelector(".lb-img").innerHTML = imgTag(list[i].s, list[i].l, "", 1600);
    box.querySelector("figcaption").textContent = list[i].l + " · foto " + (i + 1) + " dari " + list.length;
  }
  function geser(n) { i = (i + n + list.length) % list.length; tampil(); }
  function tutup() {
    box.remove();
    document.body.style.overflow = "";
    document.removeEventListener("keydown", tombol);
  }
  function tombol(e) {
    if (e.key === "Escape") tutup();
    else if (e.key === "ArrowRight") geser(1);
    else if (e.key === "ArrowLeft") geser(-1);
  }
  box.querySelector(".lb-close").onclick = tutup;
  box.querySelector(".prev").onclick = function (e) { e.stopPropagation(); geser(-1); };
  box.querySelector(".next").onclick = function (e) { e.stopPropagation(); geser(1); };
  box.onclick = function (e) { if (e.target === box || e.target.tagName === "FIGURE") tutup(); };
  document.addEventListener("keydown", tombol);
  var x0 = null;
  box.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  box.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) geser(dx < 0 ? 1 : -1);
    x0 = null;
  }, { passive: true });
  tampil();
}

      });
    });
  };

/* KTP dikecilkan lebih rapat: cukup terbaca, hemat penyimpanan. */
function kecilkanKtp(file, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var maxW = 900, w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      try { cb(c.toDataURL("image/jpeg", 0.62)); } catch (e) { cb(null); }
    };
    img.onerror = function () { cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/* Mengecilkan foto sebelum disimpan agar tidak membebani penyimpanan browser. */
function kecilkanGambar(file, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var maxW = 1280;
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      try { cb(c.toDataURL("image/jpeg", 0.72)); } catch (e) { cb(null); }
    };
    img.onerror = function () { cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

/* ---------- bukti pembayaran ---------- */
/* Bukti transfer cukup terbaca, jadi dikecilkan supaya ringan dikirim ke server. */
function kecilkanBukti(file, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var maxW = 1100, w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      try { cb(c.toDataURL("image/jpeg", 0.62)); } catch (e) { cb(null); }
    };
    img.onerror = function () { cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

    '<button class="btn" form="tenantForm" type="submit">Simpan penghuni</button>';

  openModal(isNew ? "Tambah penghuni" : "Ubah data penghuni", body, foot, function (d) {
    var f = d.querySelector("#tenantForm");
    var ktpFoto = t.ktpFoto || "";

    function gambarKtp() {
      var box = d.querySelector("#ktpBox");
      box.innerHTML = ktpFoto
        ? '<div class="ktp-ada"><img src="' + ktpFoto + '" alt="KTP ' + esc(f.nama.value || t.nama) + '">' +
        '<div class="ktp-act"><span class="chip lunas">KTP tersimpan</span>' +
        '<button type="button" class="btn ghost sm" id="ktpLihat">Lihat besar</button>' +
        '<button type="button" class="btn ghost sm" id="ktpGanti">Ganti</button>' +
        '<button type="button" class="btn ghost sm" id="ktpHapus">Hapus</button></div></div>'
        : '<label class="field">Unggah foto KTP<input type="file" accept="image/*" id="ktpFile"></label>' +
        '<p class="muted" style="font-size:12px;margin-top:6px">Gambar dikecilkan otomatis sebelum disimpan. KTP adalah data pribadi &mdash; simpan seperlunya dan jangan dibagikan ke pihak lain.</p>';
      var file = box.querySelector("#ktpFile");
      if (file) file.onchange = function () {
        var fl = file.files && file.files[0];
        if (!fl) return;
        kecilkanKtp(fl, function (url) {
          if (!url) return toast("Gambar tidak dapat dibaca");
          ktpFoto = url;
          f.ktp.value = "sudah";
          gambarKtp();
          toast("Foto KTP siap disimpan");
        });
      };
      var lihat = box.querySelector("#ktpLihat");
      if (lihat) lihat.onclick = function () {
        openLightbox([{ s: ktpFoto, l: "KTP " + (f.nama.value || t.nama) }], 0);
      };
      var ganti = box.querySelector("#ktpGanti");
      if (ganti) ganti.onclick = function () { ktpFoto = ""; gambarKtp(); };
      var hapus = box.querySelector("#ktpHapus");
      if (hapus) hapus.onclick = function () {
        if (!confirm("Hapus foto KTP penghuni ini?")) return;
        ktpFoto = ""; f.ktp.value = "belum"; gambarKtp(); toast("Foto KTP dihapus");
      };
    }
    gambarKtp();
    var dpBukti = (t.dpBukti || []).slice();
    pasangBukti(d.querySelector("#buktiDpBox"),
      function () { return dpBukti; },
      function () { },
      "Bukti DP " + (t.nama || "penghuni baru"));
    function hitung(auto) {
      var r = room(f.roomId.value);
      if (r) {
        var draft = {
          id: f.id.value, roomId: f.roomId.value, status: f.status.value,
          bulanKontrak: Number(f.bulanKontrak.value), kasur: !!f.kasur.value, dp: Number(f.dp.value) || 0
        };
        var h = hitungKamarTagihan(f.roomId.value, draft);
        var angsuran = h.perBulanOrang;
        d.querySelector("#hintTarif").innerHTML =
          "Tarif kamar " + rp(r.tarif) + " &minus; diskon " + diskonTier(h.bulan) + "% &rarr; <b>" + rp(h.perKamarNormal) + "</b>/bulan" +
          (h.n > 1 ? " (sudah termasuk penghuni ke-2)" : "") +
          (h.kasur ? " &middot; kasur " + rp(h.kasur) : "") +
          "<br>Total " + h.bulan + " bulan <b>" + rp(h.total) + "</b>" +
          (h.dp ? " &minus; DP " + rp(h.dp) + " = <b>" + rp(h.sisa) + "</b>" : "") +
          " &rarr; <b>" + rp(h.perBulanKamar) + "</b>/bulan per kamar" +
          (h.n > 1 ? ' &middot; <b style="color:var(--brand)">dibagi ' + h.n + " orang = " + rp(h.perBulanOrang) + "/orang</b>" : "") +
          "<br>Total " + h.bulan + " bulan untuk penghuni ini: <b>" + rp(angsuran * h.bulan) + "</b>";
        if (auto || !f.tarif.value) f.tarif.value = angsuran;
      }
      var bln = Number(f.bulanKontrak.value);
      if (f.masuk.value && bln && (auto || !f.keluar.value)) f.keluar.value = addMonths(f.masuk.value, bln);
    }
    ["roomId", "bulanKontrak", "kasur"].forEach(function (n) { f[n].onchange = function () { hitung(true); }; });
    f.dp.oninput = function () { hitung(true); };
    f.masuk.onchange = function () { f.keluar.value = addMonths(f.masuk.value, Number(f.bulanKontrak.value)); };
    hitung(false);

    f.onsubmit = function (e) {
      e.preventDefault();
      var data = {
        nama: f.nama.value.trim(), hp: f.hp.value.trim(), alamat: f.alamat.value.trim(),
        pekerjaan: f.pekerjaan.value.trim(), institusi: f.institusi.value.trim(),
        roomId: f.roomId.value, dp: Number(f.dp.value) || 0, masuk: f.masuk.value,
        bulanKontrak: Number(f.bulanKontrak.value), keluar: f.keluar.value,
        tarif: Number(f.tarif.value) || 0, ktp: ktpFoto ? "sudah" : f.ktp.value, status: f.status.value,
        ktpFoto: ktpFoto, kasur: !!f.kasur.value, catatan: f.catatan.value.trim(),
        dpBukti: dpBukti
      };
      var r = room(data.roomId);
      var lain = activeTenants(data.roomId).filter(function (x) { return x.id !== f.id.value; }).length;
      if (r && data.status === "aktif" && lain >= r.max) {
        if (!confirm("Kamar " + r.nama + " sudah berisi " + lain + " orang (maksimal " + r.max + "). Tetap simpan?")) return;
      }
      /* Cegah satu nama atau nomor tercatat dua kali */
      if (data.status === "aktif") {
        var dup = cariDuplikat(data.nama, data.hp, f.id.value || abaikanId);
        if (dup) {
          toast(dup.tipe === "penghuni"
            ? "\"" + dup.nama + "\" sudah terdaftar aktif di kamar " + dup.kamar + ". Ubah data yang lama, jangan buat baru."
            : "\"" + dup.nama + "\" masih punya booking aktif untuk " + dup.kamar + ". Proses booking itu lewat menu Booking.");
          return;
        }
      }
      if (f.id.value) {
        var old = tenant(f.id.value);
        Object.assign(old, data);
      } else {
        data.id = uid("T");
        S.tenants.unshift(data);
      }
      if (onSaved) onSaved();
      syncRoomStatus();
      var kamarLama = t.roomId && t.roomId !== data.roomId ? t.roomId : null;
      recalcKamar(data.roomId);
      if (kamarLama) recalcKamar(kamarLama);
      touch();
      closeModal();
      renderAdmin();
      toast("Data penghuni tersimpan");
    };
    var del = d.querySelector("[data-hapus-tenant]");
    if (del) del.onclick = function () {
      if (!confirm("Hapus data penghuni ini beserta tagihannya?")) return;
      var id = del.dataset.hapusTenant;
      var kmr = (tenant(id) || {}).roomId;
      S.tenants = S.tenants.filter(function (x) { return x.id !== id; });
      S.payments = S.payments.filter(function (x) { return x.tenantId !== id; });
      syncRoomStatus();
      if (kmr) recalcKamar(kmr);
      touch(); closeModal(); renderAdmin(); toast("Data penghuni dihapus");
    };
  });
}

/* ---------- modal kamar ---------- */

    '<label class="field">Luas (m&sup2;)<input type="number" step="0.25" name="luas" value="' + r.luas + '"></label>' +
    '<label class="field">Kamar mandi<select name="km"><option' + (r.km === "Dalam" ? " selected" : "") + ">Dalam</option>" +
    "<option" + (r.km === "Luar" ? " selected" : "") + ">Luar</option></select></label>" +

    '<label class="field">Pendingin<select name="dingin"><option' + (r.dingin === "Kipas" ? " selected" : "") + ">Kipas</option>" +

    }).join("") + "</select></label>" +
    '<label class="field">Tarif normal / bulan<input type="number" name="tarif" value="' + r.tarif + '"></label>' +
    '<label class="field">Status kamar<select name="status">' +
    ["kosong", "booking", "terisi", "perbaikan"].map(function (s) {
      return '<option value="' + s + '"' + (r.status === s ? " selected" : "") + ">" + statusLabel(s) + "</option>";
    }).join("") + "</select></label>" +
    '<label class="field" style="grid-column:1/-1">Catatan kamar<textarea name="catatan">' + esc(r.catatan) + "</textarea></label>" +
    "</form>" +
    '<div class="note">Status Kosong / Dibooking / Terisi biasanya terisi otomatis dari data penghuni dan booking. Pilih <b>Perbaikan</b> bila kamar sedang tidak bisa disewakan.</div>' +
    '<div><b style="font-size:13px">Penghuni saat ini (' + isi.length + " dari maksimal " + r.max + ")</b>" +
    (isi.length ? "<ul style=\"margin-top:8px;display:flex;flex-direction:column;gap:7px\">" + isi.map(function (t) {
      return '<li class="note" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span><b>' + esc(t.nama) + "</b> &middot; " +
        esc(t.pekerjaan || "-") + "<br>masuk " + fdate(t.masuk) + ", berakhir " + fdate(t.keluar) +
        "<br>angsuran <b>" + rp(t.tarif) + "</b>/bulan" + (Number(t.dp) ? " &middot; DP " + rp(t.dp) : "") + "</span>" +
        '<button class="btn ghost sm" data-tenant-edit="' + t.id + '">Ubah</button></li>';
    }).join("") + "</ul>" : '<p class="muted" style="font-size:13px;margin-top:6px">Kamar kosong.</p>') +
    (isi.length < r.max
      ? '<button class="btn sm" style="margin-top:10px" data-tambah-penghuni="' + r.id + '">' +
      (isi.length ? "Tambah penghuni ke kamar ini" : "Isi kamar ini dengan penghuni") + "</button>" +
      (isi.length ? '<p class="muted" style="font-size:12px;margin-top:6px">Menambah penghuni kedua membuat tarif kamar bertambah ' +
        rp(S.settings.tambahPenghuni) + "/bulan, lalu sisa setelah DP dibagi rata untuk kedua penghuni.</p>" : "")
      : '<p class="muted" style="font-size:12px;margin-top:8px">Kamar sudah penuh sesuai batas ' + r.max + " penghuni.</p>") +

    '<button class="btn" form="kmrForm" type="submit">' + (baru ? "Simpan kamar baru" : "Simpan") + "</button>",

      d.querySelector("#kmrForm").onsubmit = function (e) {
        e.preventDefault();
        var f = e.target;
        r.nama = f.nama.value.trim() || r.nama;
        r.blok = f.blok.value;
        r.lantai = Number(f.lantai.value) || r.lantai;
        r.ukuran = f.ukuran.value.trim();
        r.luas = Number(f.luas.value) || r.luas;
        r.km = f.km.value;
        r.bed = f.bed.value.trim() || r.bed;
        r.dingin = f.dingin.value;
        r.max = Number(f.max.value) || r.max;
        r.tarif = Number(f.tarif.value) || r.tarif;
        r.catatan = f.catatan.value.trim();
        r.status = f.status.value;
        if (baru) {
          if (!r.nama) return toast("Nama kamar wajib diisi");
          var kembar = S.rooms.filter(function (x) {
            return x.nama.toLowerCase() === r.nama.toLowerCase();
          })[0];
          if (kembar) return toast("Kamar bernama \"" + r.nama + "\" sudah ada. Pakai nama lain.");
          r.id = uid("R");
          r.foto = r.foto || [];
          S.rooms.push(r);
          S.rooms.sort(function (a, b) {
            return a.blok === b.blok
              ? (a.nama < b.nama ? -1 : a.nama > b.nama ? 1 : 0)
              : (a.blok < b.blok ? -1 : 1);
          });

        recalcKamar(r.id);
        touch(); closeModal(); renderAdmin();
        toast(baru ? "Kamar " + r.nama + " ditambahkan" : "Kamar " + r.nama + " diperbarui");
      };
      d.querySelectorAll("[data-tenant-edit]").forEach(function (b) {
        b.onclick = function () { formPenghuni(tenant(b.dataset.tenantEdit)); };
      });
      var tambah = d.querySelector("[data-tambah-penghuni]");
      if (tambah) tambah.onclick = function () {
        var acuan = activeTenants(r.id)[0] || {};
        formPenghuni({
          id: "", nama: "", hp: "", alamat: "", pekerjaan: "", institusi: "",
          roomId: r.id, masuk: acuan.masuk || todayISO(), bulanKontrak: acuan.bulanKontrak || 3,
          keluar: acuan.keluar || "", tarif: 0, dp: 0, kasur: !!acuan.kasur, ktp: "belum",
          catatan: "", status: "aktif"
        });
      };
      var hapus = d.querySelector("[data-hapus-kamar]");
      if (hapus) hapus.onclick = function () {
        if (activeTenants(r.id).length)
          return toast("Kamar " + r.nama + " masih ada penghuninya. Pindahkan atau keluarkan penghuninya dulu.");
        if (!confirm("Hapus kamar " + r.nama + " dari sistem? Riwayat pembayaran yang sudah tercatat tetap tersimpan.")) return;
        S.rooms = S.rooms.filter(function (x) { return x.id !== r.id; });
        touch(); closeModal(); renderAdmin(); toast("Kamar " + r.nama + " dihapus");
      };
      bindFotoKamar(d, r);
    });
}

/* ---------- admin panel: siapa yang boleh masuk ---------- */
function kodeAcak() {
  var kata = ["mahira", "kost", "blitar", "sanan", "kamar", "amanah"];
  return kata[Math.floor(Math.random() * kata.length)] + "-" +
    Math.random().toString(36).slice(2, 6) + "-" + String(new Date().getFullYear());
}

function formAdmin(a) {
  if (!bolehKelolaAdmin()) return toast("Hanya pemilik yang boleh mengatur daftar admin");
  var baru = !a;
  a = a || { id: "", nama: "", hp: "", kode: kodeAcak(), peran: "pengelola", aktif: true, dibuat: todayISO(), terakhirMasuk: "" };
  var sendiri = adminAktif && adminAktif.id === a.id;
  var jmlPemilikAktif = (S.settings.admins || []).filter(function (x) { return x.peran === "pemilik" && x.aktif !== false; }).length;

  openModal(baru ? "Tambah admin" : "Ubah admin",

/* ---------- ekspor & backup ---------- */
function csvData() {
  var head = ["Nama", "No HP", "Kamar", "Pekerjaan", "Institusi", "Masuk", "Lama kontrak",
    "Berakhir", "Tarif per bulan", "DP", "Tambah kasur", "KTP", "Status", "Catatan"];
  var rows = sortTenants(S.tenants).map(function (t) {
    return [t.nama, t.hp, (room(t.roomId) || {}).nama || "", t.pekerjaan, t.institusi,
      t.masuk, (t.bulanKontrak || "") + " bulan", t.keluar, t.tarif, t.dp,
      t.kasur ? "ya" : "tidak", t.ktp === "sudah" ? "ada" : "belum", t.status, t.catatan];
  });
  return [head].concat(rows).map(function (r) {
    return r.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(",");
  }).join("\n");
}
function simpanBerkas(nama, isi, mime) {
  if (window.__downloads) {
    window.__downloads.save({ filename: nama, data: isi, mimeType: mime }).then(function () {
      toast("Berkas " + nama + " disimpan");
    }).catch(function () { modalTeks(nama, isi); });
    return;
  }
  if (window.__inArtifact) return modalTeks(nama, isi);
  try {
    var url = URL.createObjectURL(new Blob([isi], { type: mime + ";charset=utf-8" }));
    var a = document.createElement("a");
    a.href = url; a.download = nama; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast("Berkas " + nama + " diunduh");
  } catch (e) { modalTeks(nama, isi); }
}

function modalRestore() {
  openModal("Pulihkan data dari backup",
    '<p class="muted" style="font-size:13px">Tempel isi berkas backup JSON di bawah. Seluruh data kamar, penghuni, pembayaran, dan booking akan diganti.</p>' +
    '<textarea id="rsIn" style="min-height:200px;font-family:ui-monospace,monospace;font-size:12px" placeholder="{ ... }"></textarea>',
    '<button class="btn ghost" data-close>Batal</button><button class="btn" data-do-restore>Pulihkan sekarang</button>',
    function (d) {
      d.querySelector("[data-do-restore]").onclick = function () {
        try {
          var obj = JSON.parse(d.querySelector("#rsIn").value);
          if (!obj.rooms || !obj.settings) throw new Error("bad");
          S = obj;
          S.tenants = S.tenants || []; S.payments = S.payments || []; S.bookings = S.bookings || [];
          syncRoomStatus(); touch(); closeModal(); renderAdmin(); toast("Data berhasil dipulihkan");
        } catch (e) { toast("Berkas backup tidak dikenali"); }
      };
    });
}

/* Mengisi buku penghuni dari berkas JSON.

   Berbeda dengan "Pulihkan dari cadangan" yang mengganti seluruh isi
   aplikasi: ini hanya menyentuh daftar penghuni dan booking, sehingga
   kamar, tarif, fasilitas, dan pengaturan tetap seperti sekarang.
   Kamar dicocokkan lewat roomId, kalau tidak ketemu dicoba lewat nama. */
function modalImporPenghuni() {
  openModal("Impor buku penghuni",
    '<p style="font-size:13.5px">Tempel isi berkas JSON buku penghuni. ' +
    "Daftar penghuni dan booking yang ada sekarang akan <b>diganti</b>; " +
    "kamar, tarif, fasilitas, dan pengaturan tidak ikut berubah.</p>" +
    '<button class="btn ghost sm" id="imporPCadangan" type="button">Unduh cadangan dulu</button>' +
    '<label class="field" style="margin-top:8px"><span>Pilih berkas JSON</span>' +
    '<input type="file" id="imporPBerkas" accept=".json,application/json"></label>' +
    '<p class="muted" style="font-size:12px;margin:6px 0 0">Atau tempel isinya langsung di bawah.</p>' +
    '<textarea id="imporPIsi" style="min-height:140px;font-family:ui-monospace,monospace;font-size:12px;margin-top:4px" placeholder=\'{ "tenants": [ ... ] }\'></textarea>',
    '<button class="btn ghost" data-close>Batal</button>' +
    '<button class="btn" id="imporPJalan">Impor</button>',
    function (d) {
      d.querySelector("#imporPCadangan").onclick = function () {
        simpanBerkas("cadangan-sebelum-impor-" + todayISO() + ".json", JSON.stringify(S, null, 2), "application/json");
      };
      d.querySelector("#imporPBerkas").onchange = function (ev) {
        var berkas = ev.target.files && ev.target.files[0];
        if (!berkas) return;
        var pembaca = new FileReader();
        pembaca.onload = function () {
          d.querySelector("#imporPIsi").value = String(pembaca.result || "");
          toast("Berkas terbaca: " + berkas.name);
        };
        pembaca.onerror = function () { toast("Berkas tidak bisa dibaca"); };
        pembaca.readAsText(berkas);
      };
      d.querySelector("#imporPJalan").onclick = function () {
        var obj;
        try {
          obj = JSON.parse(d.querySelector("#imporPIsi").value);
        } catch (e) { return toast("Isi berkas bukan JSON yang sah"); }
        if (!obj || !Array.isArray(obj.tenants)) return toast("Berkas tidak berisi daftar penghuni");

        /* Nama kamar didahulukan karena itu yang bisa diperiksa manusia;
           roomId hanya cadangan kalau namanya tidak cocok. */
        function cariKamar(x) {
          var n = String(x.kamar || "").trim().toLowerCase();
          if (n) {
            var k = S.rooms.filter(function (r) { return String(r.nama).trim().toLowerCase() === n; })[0];
            if (k) return k.id;
          }
          return x.roomId && room(x.roomId) ? x.roomId : "";
        }
        var gagal = [];
        var masuk = obj.tenants.map(function (t, i) {
          var rid = cariKamar(t);
          if (!rid) gagal.push(t.nama || "baris " + (i + 1));
          return Object.assign({}, t, { id: t.id || uid("T"), roomId: rid, status: t.status || "aktif" });
        });
        if (gagal.length) return toast("Kamar tidak dikenali untuk: " + gagal.join(", "));

        S.tenants = masuk;
        S.payments = [];
        if (Array.isArray(obj.bookings)) {
          S.bookings = obj.bookings.map(function (b, i) {
            return Object.assign({}, b, { id: b.id || uid("B"), roomId: cariKamar(b), status: b.status || "aktif" });
          });
        }
        S.rooms.forEach(function (r) {
          if (r.status === "terisi" || r.status === "booking") r.status = "kosong";
        });
        syncRoomStatus();
        touch();
        closeModal();
        renderAdmin();
        toast(S.tenants.length + " penghuni dan " + (S.bookings || []).length +
          " booking masuk. Tekan Kirim ke server untuk menyimpannya.");
      };
    });
}

  var bb = root.querySelector('[data-act="booking-baru"]');

  var ec = root.querySelector('[data-act="ekspor-csv"]');
  if (ec) ec.onclick = function () { simpanBerkas("penghuni-kost-mahira.csv", csvData(), "text/csv"); };
  ["penghuni", "booking"].forEach(function (j) {
    var b = root.querySelector('[data-act="reset-' + j + '"]');
    if (b) b.onclick = function () { modalReset(j); };
  });
  var bk = root.querySelector('[data-act="backup"]');
  if (bk) bk.onclick = function () { simpanBerkas("backup-kost-mahira.json", JSON.stringify(S, null, 2), "application/json"); };
  var rs = root.querySelector('[data-act="restore"]');
  if (rs) rs.onclick = function () { modalRestore(); };
  var il = root.querySelector('[data-act="impor-lama"]');
  if (il) il.onclick = function () { modalImporLama(); };
  var ip = root.querySelector('[data-act="impor-penghuni"]');
  if (ip) ip.onclick = function () { modalImporPenghuni(); };

  var cari = root.querySelector("#cari");
  if (cari) {
    cari.oninput = function () {
      ui.cari = cari.value;
      renderAdmin();
      var c = document.getElementById("cari");
      if (c) { c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
    };
  }
  var fs = root.querySelector("#fstatus");
  if (fs) { fs.value = ui.filterStatus; fs.onchange = function () { ui.filterStatus = fs.value; renderAdmin(); }; }

  /* skema diskon */
  function bacaDiskon() {
    var rows = root.querySelectorAll(".diskon-row");
    var out = [];
    Array.prototype.forEach.call(rows, function (r) {
      var mulai = Number(r.querySelector('[data-diskon="mulai"]').value);
      var persen = Number(r.querySelector('[data-diskon="persen"]').value);
      if (mulai > 0 && persen >= 0) out.push({ mulai: mulai, persen: persen });
    });
    return out.sort(function (a, b) { return a.mulai - b.mulai; });
  }
  var dSimpan = root.querySelector("[data-diskon-simpan]");
  if (dSimpan) dSimpan.onclick = function () {
    var d = bacaDiskon();
    if (!d.length) return toast("Isi minimal satu tingkat diskon");
    S.settings.diskon = d;
    S.rooms.forEach(function (k) { recalcKamar(k.id); });
    touch(); renderAdmin(); toast("Skema diskon disimpan: " + labelDiskon().replace(/&ndash;/g, "-"));
  };
  var dTambah = root.querySelector("[data-diskon-tambah]");
  if (dTambah) dTambah.onclick = function () {
    var d = bacaDiskon();
    var akhir = d[d.length - 1] || { mulai: 0, persen: 0 };
    d.push({ mulai: Number(akhir.mulai) + 2, persen: Number(akhir.persen) + 5 });
    S.settings.diskon = d;
    renderAdmin();
  };
  root.querySelectorAll("[data-diskon-hapus]").forEach(function (b) {
    b.onclick = function () {
      var d = bacaDiskon();
      if (d.length <= 1) return toast("Minimal satu tingkat diskon harus ada");
      d.splice(Number(b.dataset.diskonHapus), 1);
      S.settings.diskon = d;
      S.rooms.forEach(function (k) { recalcKamar(k.id); });
      touch(); renderAdmin(); toast("Tingkat diskon dihapus");

  /* impor daftar harga */

    berkas.onchange = function () {

      var sama = cek.filter(function (c) { return c.kamar && !c.ubah.length; });
      var baru = cek.filter(function (c) { return !c.kamar; });
      var dBaru = baca.diskon;
      var dSama = dBaru && JSON.stringify(dBaru) === JSON.stringify(tierDiskon().map(function (t) {
        return { mulai: Number(t.mulai), persen: Number(t.persen) };
      }));
      hasilBox.innerHTML =
        '<div class="note">Terbaca <b>' + baca.baris.length + "</b> baris: <b>" + cocok.length + "</b> kamar berubah, " +

          dBaru.map(function (d) { return d.persen + "% mulai " + d.mulai + " bulan"; }).join(", ") + "</b>. " +
          (dSama ? "Sama dengan skema yang berlaku sekarang."
            : '<button class="btn sm" id="imporDiskon" type="button" style="margin-left:6px">Pakai skema diskon ini</button>') + "</div>" : "") +
        '<div class="scrollx" style="margin-top:10px"><table><thead><tr><th>Kamar</th><th>Perubahan</th><th>Tarif baru</th></tr></thead><tbody>' +
        cek.map(function (c) {
          return "<tr><td><b>" + esc(c.data.nama) + "</b>" +

            "<td>" + (c.kamar ? (c.ubah.length ? c.ubah.join(" &middot; ") : '<span class="muted">tidak ada perubahan</span>')
              : '<span class="muted">akan ditambah sebagai kamar baru bila opsi dicentang</span>') + "</td>" +
            '<td class="tnum">' + rp(c.data.tarif) + "</td></tr>";

        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">' +

  /* penyunting daftar ketentuan & peraturan */

    };

  root.querySelectorAll("[data-le-save]").forEach(function (b) {
    b.onclick = function () {
      var n = b.dataset.leSave;
      S[n] = bacaList(n);
      touch(); renderAdmin();
      toast((n === "ketentuan" ? "Ketentuan sewa" : "Peraturan kost") + " tersimpan");
    };
  });
  root.querySelectorAll("[data-le-add]").forEach(function (b) {
    b.onclick = function () {
      var n = b.dataset.leAdd;
      S[n] = bacaList(n).concat([""]);
      renderAdmin();
      var f = document.querySelectorAll('[data-le="' + n + '"]');
      if (f.length) f[f.length - 1].focus();
    };
  });
  root.querySelectorAll("[data-le-del]").forEach(function (b) {
    b.onclick = function () {
      var n = b.dataset.leDel, i = Number(b.dataset.i);
      var arr = bacaList(n);
      arr.splice(i, 1);
      S[n] = arr; touch(); renderAdmin(); toast("Baris dihapus");
    };
  });
  ["leUp", "leDown"].forEach(function (arah) {
    root.querySelectorAll("[data-" + (arah === "leUp" ? "le-up" : "le-down") + "]").forEach(function (b) {
      b.onclick = function () {
        var n = arah === "leUp" ? b.dataset.leUp : b.dataset.leDown;
        var i = Number(b.dataset.i);
        var j = arah === "leUp" ? i - 1 : i + 1;
        var arr = bacaList(n);
        if (j < 0 || j >= arr.length) return;
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        S[n] = arr; touch(); renderAdmin();
      };
    });
  });

  var uBaru = root.querySelector('[data-act="ulasan-baru"]');
  if (uBaru) uBaru.onclick = function () { formUlasan(null); };
  var uTempel = root.querySelector('[data-act="ulasan-tempel"]');
  if (uTempel) uTempel.onclick = function () { modalTempelUlasan(); };
  root.querySelectorAll("[data-ulasan-edit]").forEach(function (b) {
    b.onclick = function () {
      formUlasan(S.ulasan.filter(function (x) { return x.id === b.dataset.ulasanEdit; })[0]);
    };
  });
  var uRingkas = root.querySelector('[data-act="ulasan-simpan-ringkas"]');
  if (uRingkas) uRingkas.onclick = function () {
    S.settings.ulasanRating = root.querySelector("#ulasanRating").value.trim();
    S.settings.ulasanJumlah = Number(root.querySelector("#ulasanJumlah").value) || 0;
    touch(); renderAdmin(); toast("Ringkasan ulasan disimpan");
  };
  var uEmbed = root.querySelector('[data-act="ulasan-simpan-embed"]');
  if (uEmbed) uEmbed.onclick = function () {
    S.settings.ulasanEmbed = root.querySelector("#ulasanEmbedKode").value.trim();
    touch(); renderAdmin();
    toast(S.settings.ulasanEmbed ? "Widget ulasan aktif di halaman publik" : "Kembali memakai daftar ulasan sendiri");
  };

  var fBaru = root.querySelector('[data-act="fasilitas-baru"]');
  if (fBaru) fBaru.onclick = function () { formFasilitas(null); };
  root.querySelectorAll("[data-fasilitas-edit]").forEach(function (b) {
    b.onclick = function () {
      formFasilitas(S.fasilitas.filter(function (x) { return x.id === b.dataset.fasilitasEdit; })[0]);
    };
  });

  var pBaru = root.querySelector('[data-act="partner-baru"]');
  if (pBaru) pBaru.onclick = function () { formPartner(null); };
  root.querySelectorAll("[data-partner-edit]").forEach(function (b) {
    b.onclick = function () {
      formPartner(S.partners.filter(function (x) { return x.id === b.dataset.partnerEdit; })[0]);
    };
  });
  root.querySelectorAll("[data-partner-wa]").forEach(function (b) {
    b.onclick = function () {
      var p = S.partners.filter(function (x) { return x.id === b.dataset.partnerWa; })[0];
      if (!p) return;
      window.open("https://wa.me/" + normHp(p.hp) + "?text=" + encodeURIComponent(p.pesan || ""), "_blank", "noopener");
    };
  });

  var svForm = root.querySelector("#srvForm");
  if (svForm) {
    function simpanSrv() {
      if (!KONFIG.url) S.settings.server.url = svForm.url.value.trim();
      S.settings.server.auto = root.querySelector("#srvAuto").checked;
      saveLocal();
    }
    var bSimpanUrl = root.querySelector("#srvSimpanUrl");
    if (bSimpanUrl) bSimpanUrl.onclick = function () {
      simpanSrv(); renderAdmin();
      toast(srvAktif() ? "Alamat server disimpan untuk perangkat ini" : "Alamat server dikosongkan");
    };
    root.querySelector("#srvTes").onclick = function () {
      simpanSrv();
      if (!srvAktif()) return toast("Isi alamat server terlebih dahulu");
      toast("Menghubungi server...");
      srvFetch("mode=cek").then(function (j) {
        if (j && j.ok) toast(j.updatedAt ? "Koneksi berhasil. Data terakhir di server " + waktuSingkat(j.updatedAt) : "Koneksi berhasil, server masih kosong");
        else toast("Server menolak: " + ((j && j.error) || "tidak dikenal"));
        srv.galat = ""; tandaiSegar();
      }).catch(function () {
        toast("Tidak dapat menghubungi alamat itu. Periksa URL /exec dan akses Anyone.");
      });
    };
    root.querySelector("#srvPush").onclick = function () { simpanSrv(); srvSimpan(false); };
    root.querySelector("#srvPull").onclick = function () { simpanSrv(); srvSegarkanAdmin(false); };
    root.querySelector("#srvKode").onclick = function () { modalTeks("kode-apps-script.gs", kodeAppsScript()); };
    root.querySelector("#srvKonfig").onclick = function () {
      var u = KONFIG.url || S.settings.server.url || "";
      if (!u) return toast("Isi alamat server terlebih dahulu");
      simpanBerkas("konfigurasi.json", JSON.stringify({ serverUrl: u }, null, 2), "application/json");
      toast("Unggah berkas ini ke folder yang sama dengan index.html");
    };
  }

  /* ---- daftar admin ---- */
  var admBaru = root.querySelector('[data-act="admin-baru"]');
  if (admBaru) admBaru.onclick = function () { formAdmin(null); };
  root.querySelectorAll("[data-admin-edit]").forEach(function (b) {
    b.onclick = function () {
      formAdmin((S.settings.admins || []).filter(function (a) { return a.id === b.dataset.adminEdit; })[0]);
    };
  });
  root.querySelectorAll("[data-kode-lihat]").forEach(function (b) {
    b.onclick = function () {
      var a = (S.settings.admins || []).filter(function (x) { return x.id === b.dataset.kodeLihat; })[0];
      var box = root.querySelector('[data-kode-box="' + b.dataset.kodeLihat + '"]');
      if (!a || !box) return;
      if (box.dataset.buka === "1") { box.textContent = "\u2022\u2022\u2022\u2022\u2022\u2022"; box.dataset.buka = ""; b.textContent = "Lihat"; }
      else { box.textContent = a.kode; box.dataset.buka = "1"; b.textContent = "Sembunyikan"; }
    };
  });
  root.querySelectorAll("[data-admin-wa]").forEach(function (b) {
    b.onclick = function () {
      var a = (S.settings.admins || []).filter(function (x) { return x.id === b.dataset.adminWa; })[0];
      if (!a) return;
      var alamat = (location.origin + location.pathname).replace(/\/index\.html$/, "/").replace(/\/+$/, "");
      var pesan = waTeks("undangan", {
        kost: S.settings.nama, nama: a.nama, alamat: alamat + "/admin", kode: a.kode
      });
      if (a.hp) window.open("https://wa.me/" + normHp(a.hp) + "?text=" + encodeURIComponent(pesan), "_blank", "noopener");
      else modalTeks("Undangan admin", pesan);
    };
  });

  var sf = root.querySelector("#setForm");
  if (sf) sf.onsubmit = function (e) {
    e.preventDefault();
    var f = e.target;
    S.settings.nama = f.nama.value.trim() || S.settings.nama;
    S.settings.wa = f.wa.value.replace(/[^0-9]/g, "") || S.settings.wa;
    S.settings.alamat = f.alamat.value.trim();
    S.settings.katalog = f.katalog.value.trim();
    S.settings.ulasan = f.ulasan.value.trim();
    ["dp", "harian", "mingguan", "tambahPenghuni", "tambahKasur"].forEach(function (k) {
      S.settings[k] = Number(f[k].value) || 0;
    });
    touch(); renderAdmin(); toast("Pengaturan tersimpan");
  };
}
function normHp(hp) {
  var s = String(hp || "").replace(/[^0-9]/g, "");
  if (s.indexOf("0") === 0) s = "62" + s.slice(1);
  if (s.indexOf("62") !== 0 && s) s = "62" + s;
  return s || S.settings.wa;
}

/* ---------- 7. INIT ---------- */
function renderApp() {
  window.scrollTo(0, 0);
  if (view === "admin") renderAdmin(); else renderPublic();
}

(function boot() {
  S = loadState();
  /* Salinan data publik terakhir dipakai lebih dulu supaya halaman tampil
     seketika, lalu diperbarui dari server begitu jawabannya datang. */
  var simpanan = cachePublik();
  if (simpanan && !punyaDataAdmin()) terapkanPublik(simpanan, true);
  syncRoomStatus();
  applyTheme();
  /* Panel admin dibuka dengan mengetik alamat situs + /admin (atau #admin). */
  if (location.hash === "#admin" || /\/admin\/?$/.test(location.pathname)) view = "admin";
  renderApp();
  muatKonfigurasi().then(function () {
    tandaiSegar();
    /* Konfigurasi baru selesai dibaca setelah layar pertama digambar.
       Kalau ternyata Supabase yang aktif, layar masuk harus digambar
       ulang supaya memunculkan isian email + kata sandi, bukan kode PIN. */
    if (view === "admin" && !unlocked && sbAktif()) renderLogin();
    if (!srvAktif()) return;
    /* Di layar masuk admin, data publik yang besar belum diperlukan.
       Cukup satu panggilan ringan supaya server sudah "bangun" saat kode
       dikirim. Supabase tidak perlu dibangunkan, jadi dilewati. */
    if (view === "admin" && !unlocked) {
      if (!sbAktif()) srvFetch("mode=cek").catch(function () { });
    } else srvMuatPublik(false, true);
    srvPantau();
  });
  window.__inArtifact = !!(window.claude && typeof window.claude.use === "function");
  if (window.__inArtifact) {
    window.claude.use("artifact").then(function (api) {
      if (api && typeof api.publish === "function") artifactApi = api;
    }).catch(function () { });
    window.claude.use("downloads").then(function (api) {
      if (api && typeof api.save === "function") window.__downloads = api;
    }).catch(function () { });
  }
})();

</script>
</body>
</html>
